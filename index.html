<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DispoHub — Deal Disposition CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: #0a1423; color: #e9edf3; font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh; overflow-x: hidden;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  /* ===== Header ===== */
  .header {
    border-bottom: 1px solid #16283f; padding: 20px 28px 0; position: sticky; top: 0;
    background: rgba(10,20,35,.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); z-index: 20;
    transition: transform .25s ease, opacity .25s ease;
  }
  .header::after {
    content: ''; display: block; height: 1px; margin: 14px -28px 0;
    background: linear-gradient(90deg, transparent, rgba(212,168,67,.4), transparent);
  }
  .header-inner, .content { max-width: 1120px; margin: 0 auto; }
  .header-inner { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand h1 { margin: 2px 0 0; font-family: 'Cinzel', serif; font-size: 27px; font-weight: 700; letter-spacing: .04em; color: #e9c874; background: linear-gradient(180deg, #f3dda0 0%, #d4a843 70%, #b98a2f 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .btn-gold {
    background: linear-gradient(180deg, #e3b95c, #c9992f); color: #0d1b2e; border: 1px solid rgba(255,255,255,.14);
    border-radius: 10px; padding: 10px 20px; font-weight: 700; font-size: 14px; cursor: pointer; font-family: inherit;
    box-shadow: 0 2px 10px rgba(212,168,67,.22), inset 0 1px 0 rgba(255,255,255,.25);
  }
  .btn-gold:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(212,168,67,.32); }
  .btn-ghost {
    background: rgba(255,255,255,.03); border: 1px solid #22385a; color: #c7d2e0; border-radius: 10px;
    padding: 10px 16px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .btn-ghost:hover { border-color: rgba(212,168,67,.5); color: #e8c476; }

  .content { padding: 18px 20px 80px; }

  /* ===== Tabs ===== */
  .tabs { display: flex; gap: 6px; margin: 4px 0 16px; border-bottom: 1px solid #16283f; }
  .tab-btn {
    background: none; border: none; color: #8a97a8; font-size: 15px; font-weight: 700; padding: 12px 20px;
    cursor: pointer; font-family: inherit; border-bottom: 2px solid transparent; margin-bottom: -1px;
    display: flex; align-items: center; gap: 8px;
  }
  .tab-btn.active { color: #e8c476; border-bottom-color: #d4a843; }
  .tab-btn .pill { background: rgba(212,168,67,.14); color: #e8c476; font-size: 12px; padding: 2px 10px; border-radius: 12px; font-weight: 700; }

  /* ===== Stage filter row ===== */
  .stage-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .stage-btn {
    background: rgba(255,255,255,.025); border: 1px solid #22385a; color: #c7d2e0; border-radius: 10px;
    padding: 9px 15px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .stage-btn:hover { border-color: rgba(212,168,67,.5); color: #e8c476; }
  .stage-btn.active { border-color: rgba(212,168,67,.6); background: rgba(212,168,67,.09); color: #e8c476; }
  .stage-btn .count { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }

  /* ===== Deal cards ===== */
  .deal-card {
    background: linear-gradient(180deg, #1e3a5f, #1a3355); border: 1px solid #2a4a73; border-radius: 16px;
    overflow: hidden; margin-bottom: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.35); cursor: pointer;
    transition: transform .18s ease, border-color .18s ease;
  }
  .deal-card:hover { transform: translateY(-2px); border-color: rgba(212,168,67,.4); }
  .deal-row { padding: 14px 16px; }
  .deal-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .deal-addr { font-weight: 800; font-size: 17px; }
  .stage-badge { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; border: 1px solid; white-space: nowrap; }
  .deal-sub { font-size: 13px; color: #aeb9c7; margin-top: 5px; }
  .deal-numbers { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; }
  .deal-num .l { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: #8a97a8; }
  .deal-num .v { font-size: 16px; font-weight: 800; color: #e8c476; font-family: 'JetBrains Mono', monospace; }
  .deal-num .v.green { color: #4caf82; }
  .deal-meta { display: flex; gap: 12px; margin-top: 10px; font-size: 12px; color: #8a97a8; flex-wrap: wrap; }
  .urgent { color: #e07a77; font-weight: 700; }

  /* ===== Buyer cards ===== */
  .buyer-card {
    background: linear-gradient(180deg, #1e3a5f, #1a3355); border: 1px solid #2a4a73; border-radius: 16px;
    padding: 14px 16px; margin-bottom: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.35); cursor: pointer;
  }
  .buyer-card:hover { border-color: rgba(212,168,67,.4); }
  .buyer-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .buyer-name { font-weight: 800; font-size: 16px; }
  .buyer-type { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; background: rgba(143,192,228,.12); color: #8fc0e4; border: 1px solid rgba(143,192,228,.4); }
  .buyer-type.llc { background: rgba(212,168,67,.12); color: #e8c476; border-color: rgba(212,168,67,.4); }
  .buyer-contact { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .call-link { font-size: 15px; color: #e8c476; font-weight: 700; text-decoration: none; }
  .buyer-buybox { font-size: 13px; color: #aeb9c7; margin-top: 8px; font-style: italic; }
  .buyer-stats { display: flex; gap: 14px; margin-top: 8px; font-size: 12px; color: #8a97a8; flex-wrap: wrap; }
  .buyer-stats b { color: #e8c476; }
  .inactive-tag { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; background: rgba(217,83,79,.12); color: #e07a77; border: 1px solid rgba(217,83,79,.4); }

  /* ===== Detail view ===== */
  .detail-wrap { max-width: 720px; margin: 0 auto; }
  .back-btn { background: none; border: none; color: #8a97a8; font-size: 14px; cursor: pointer; margin-bottom: 12px; font-family: inherit; }
  .back-btn:hover { color: #e8c476; }
  .detail-card { background: linear-gradient(180deg, #1e3a5f, #182c49); border: 1px solid #2a4a73; border-radius: 18px; padding: 22px; margin-bottom: 14px; }
  .detail-card h2 { font-size: 22px; margin-bottom: 4px; }
  .detail-card .addr-sub { color: #aeb9c7; font-size: 14px; margin-bottom: 14px; }
  .num-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 14px 0; }
  .num-box { background: rgba(0,0,0,.25); border: 1px solid #22385a; border-radius: 12px; padding: 12px; }
  .num-box .l { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: #8a97a8; }
  .num-box .v { font-size: 19px; font-weight: 800; color: #e8c476; font-family: 'JetBrains Mono', monospace; margin-top: 4px; }
  .num-box .v.green { color: #4caf82; }
  .num-box input { width: 100%; background: transparent; border: none; color: #e8c476; font-family: 'JetBrains Mono', monospace; font-size: 19px; font-weight: 800; outline: none; }
  .section-label { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #d4a843; font-weight: 700; margin: 18px 0 10px; }
  .photo-section { margin-top: 4px; }
  .drive-link-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .drive-link-row input {
    flex: 1 1 220px; padding: 10px 12px; border-radius: 10px; border: 1px solid #22385a; background: #0b1626;
    color: #e9edf3; font-size: 14px;
  }
  .drive-open-btn {
    background: #d4a843; color: #0d1b2e; border: none; border-radius: 10px; padding: 10px 16px;
    font-size: 13px; font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    text-decoration: none; display: inline-block;
  }
  .drive-edit-btn {
    background: #142640; color: #9fb3cc; border: 1px solid #22385a; border-radius: 10px; padding: 10px 12px;
    font-size: 14px; cursor: pointer;
  }
  .drive-carousel { display: flex; gap: 8px; overflow-x: auto; margin-top: 12px; padding-bottom: 4px; }
  .drive-thumb-link { flex: 0 0 auto; }
  .drive-thumb { width: 76px; height: 76px; object-fit: cover; border-radius: 8px; border: 1px solid #3a5a85; display: block; }
  .drive-carousel-msg { font-size: 12px; color: #8a97a8; margin-top: 8px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .form-field label { display: block; font-size: 11px; color: #8a97a8; margin-bottom: 5px; font-weight: 600; }
  .form-field input, .form-field select, .form-field textarea {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #22385a;
    background: #0b1626; color: #e9edf3; font-size: 14px; font-family: inherit;
  }
  .form-field textarea { resize: vertical; min-height: 70px; }
  .form-field input:focus, .form-field select:focus, .form-field textarea:focus { border-color: #d4a843; outline: none; }

  /* Timeline */
  .timeline { display: flex; flex-direction: column; }
  .timeline-item { padding: 10px 0; border-bottom: 1px solid #1a2f4d; font-size: 14px; }
  .timeline-item:last-child { border-bottom: none; }
  .timeline-ts { color: #8a97a8; font-size: 12px; }
  .timeline-empty { color: #5c6b82; font-size: 13px; padding: 12px 0; font-style: italic; }

  /* Match list */
  .match-row { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid #22385a; border-radius: 12px; margin-bottom: 8px; background: rgba(0,0,0,.2); }
  .match-score { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 18px; color: #e8c476; min-width: 52px; text-align: center; }
  .match-info { flex: 1; min-width: 0; }
  .match-info .n { font-weight: 700; font-size: 14px; }
  .match-info .w { font-size: 12px; color: #8a97a8; margin-top: 2px; }
  .match-call { flex-shrink: 0; }

  .empty-state { text-align: center; color: #5c6b82; padding: 40px 20px; font-size: 14px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #16294a; border: 1px solid #d4a843; color: #e8c476; padding: 12px 22px; border-radius: 12px; font-weight: 700; z-index: 9999; display: none; }
  .btn-ghost.armed { border-color: #e07a77 !important; color: #fff !important; background: rgba(217,83,79,.25) !important; animation: armPulse 1s ease-in-out infinite; }
  @keyframes armPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(217,83,79,.4); } 50% { box-shadow: 0 0 0 6px rgba(217,83,79,0); } }
  /* Buyer search */
  #buyer-map { height: 380px; border-radius: 14px; border: 1px solid #2a4a73; z-index: 1; }
  .leaflet-container { background: #0b1626; font-family: 'Inter', sans-serif; }
  .search-card { cursor: pointer; }
  .search-card:hover { border-color: rgba(212,168,67,.4); }
  .status-badge { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; border: 1px solid; white-space: nowrap; }
  @media (max-width: 640px){ #buyer-map { height: 320px; } }  .toolbar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .search-wrap { position: relative; flex: 1 1 220px; }
  .search-wrap input { width: 100%; padding: 11px 12px 11px 38px; border-radius: 10px; border: 1px solid #22385a; background: #0b1626; color: #e9edf3; font-size: 14px; }
  .search-wrap span { position: absolute; left: 12px; top: 11px; }

  /* ===== Mobile ===== */
  @media (max-width: 640px) {
    body { padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
    .header { padding: 14px 14px 0; }
    .header.header-hidden { transform: translateY(-110%); opacity: 0; pointer-events: none; }
    .brand h1 { font-size: 19px; }
    .content { padding: 14px 12px calc(60px + env(safe-area-inset-bottom)); }
    .tabs { overflow-x: auto; }
    .tab-btn { padding: 12px 14px; font-size: 14px; flex: 0 0 auto; }
    .form-grid { grid-template-columns: 1fr; }
    .form-field input, .form-field select, .form-field textarea { font-size: 16px; padding: 13px 12px; }
    .btn-gold, .btn-ghost { min-height: 48px; }
    .deal-numbers { gap: 10px; }
    .call-link { min-height: 48px; display: inline-flex; align-items: center; font-size: 17px; }
    .num-grid { grid-template-columns: 1fr 1fr; }
  }
  /* ===== DispoHub Dialer (single-column: card top, notes + dispos below) ===== */
  .dd-wrap { max-width: 560px; margin: 0 auto; }
  .dd-top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .dd-progress { flex: 1; text-align: center; color: #8a97a8; font-size: 14px; font-weight: 700; }
  .dd-stats { text-align: center; color: #5c6b82; font-size: 12px; margin-bottom: 12px; line-height: 1.8; }
  .dd-card { background: linear-gradient(180deg, #142a47, #0f2140); border: 1px solid #1e3554; border-radius: 18px; padding: 24px 20px; margin-bottom: 16px; }
  .dd-day { display: inline-block; background: rgba(212,168,67,.14); color: #e8c476; font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 12px; margin-bottom: 12px; }
  .dd-name { font-size: 24px; font-weight: 800; color: #e9edf3; }
  .dd-entity { color: #8a97a8; font-size: 13px; margin: 4px 0 12px; }
  .dd-row { font-size: 14px; color: #aeb9c7; margin-bottom: 8px; line-height: 1.5; }
  .dd-row b { color: #e9edf3; }
  .dd-last { font-size: 12px; color: #8a97a8; margin-bottom: 4px; }
  .dd-call { display: flex; align-items: center; justify-content: center; gap: 10px; background: linear-gradient(180deg, #e3b95c, #c9992f); color: #0d1b2e; font-size: 22px; font-weight: 800; border-radius: 16px; padding: 18px; text-decoration: none; margin: 14px 0 4px; box-shadow: 0 4px 18px rgba(212,168,67,.28); }
  .dd-call:active { transform: scale(.98); }
  .dd-notes { margin-top: 12px; }
  .dd-notes textarea { width: 100%; background: rgba(18,37,64,.6); border: 1px solid #22385a; border-radius: 10px; padding: 12px; color: #e9edf3; font-family: inherit; font-size: 14px; resize: vertical; box-sizing: border-box; }
  .dd-outcomes { margin-top: 18px; }
  .dd-outcome-grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .dd-outcome { flex: 1 1 30%; min-width: 140px; background: rgba(255,255,255,.03); border: 1px solid #2f4d78; color: #e9edf3; border-radius: 12px; padding: 15px 10px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; min-height: 56px; }
  .dd-outcome:active { background: rgba(212,168,67,.15); border-color: #d4a843; }
  .dd-nav-row { display: flex; gap: 10px; margin: 0 0 14px; }
  .dd-nav-btn { flex: 1; min-height: 52px; border-radius: 12px; font-size: 16px; font-weight: 700; background: rgba(18,37,64,.85); border: 1px solid #2f4d78; color: #9aa7ba; cursor: pointer; font-family: inherit; }
  .dd-nav-btn:active { border-color: #d4a843; color: #e8c476; }
  .dd-done { text-align: center; padding: 48px 20px; }
  .dd-filter { display: flex; gap: 10px; margin-bottom: 14px; align-items: center; flex-wrap: wrap; }
  .dd-filter select { flex: 1; min-width: 180px; background: #0d1b2e; color: #e9edf3; border: 1px solid #2f4d78; border-radius: 10px; padding: 12px; font-size: 15px; font-family: inherit; }
  .dd-cadence { background: rgba(18,37,64,.6); border: 1px solid #1e3554; border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; font-size: 13px; color: #8a97a8; line-height: 1.9; }
  .dd-cadence b { color: #e8c476; }
  .dd-paused-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: rgba(18,37,64,.5); border: 1px solid #22385a; border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; font-size: 14px; color: #aeb9c7; }
</style>
</head>

<div class="header" id="site-header">
  <div class="header-inner">
    <div class="brand">
      <img src="https://raw.githubusercontent.com/lucarebuffi-rgr/signature-assets/main/rgr_logo.png" alt="RGR" style="height:42px;width:auto;flex-shrink:0;" />
      <h1>DispoHub</h1>
    </div>
    <div class="header-actions">
      <button class="btn-ghost" id="import-buyers-btn" title="Import buyers from Google Sheet">📥 Import Buyers</button>
      <button class="btn-gold" id="add-deal-btn">+ Add Deal</button>
    </div>
  </div>
  <div class="header-inner">
    <div class="tabs" style="border-bottom:none; margin: 10px 0 0;">
      <button class="tab-btn active" data-tab="deals">📦 Deals <span class="pill" id="deals-pill">0</span></button>
      <button class="tab-btn" data-tab="buyers">🤝 Buyers <span class="pill" id="buyers-pill">0</span></button>
      <button class="tab-btn" data-tab="find">🔍 Find Buyers</button>
      <button class="tab-btn" data-tab="kpis">📊 KPIs</button>
      <button class="tab-btn" data-tab="dialer">📞 Dialer <span class="pill" id="dialer-pill">0</span></button>
    </div>
  </div>
</div>

<div class="content" id="content"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   MARKET DUPLICATION GUIDE — To clone this Dispo CRM for a new market:
   1. Copy index.html to a new repo (or new branch).
   2. Update CONFIG below: SHEETS_API_KEY, BUYERS_SHEET_ID.
   3. Update firebaseConfig below: create a new Firebase project, paste its config.
   4. Firestore collections (dispoDeals, dispoBuyers, dispoOffers, dispoActivity)
      are auto-created on first write — no manual setup needed.
   5. Update the <title> tag and header branding if desired.
   6. Deploy to GitHub Pages. Done.
   ========================================================================= */
const CONFIG = {
  SHEETS_API_KEY: "AIzaSyB7oi16sfduaeHMTRRZiv8Q9xM_TQtOKy4",
  BUYERS_SHEET_ID: "1W3CtABUZsQ03ixuUIJKEqmD5l8Xz05b6Le30ABCjxuU",
  BUYERS_TAB: "Buyers"
};

/* ---------------- Firebase (same project as the acquisitions CRM) ---------------- */
const firebaseConfig = {
  apiKey: "AIzaSyDNpa-2O0RduvXa5qmmIfFoioKG4gyoCOs",
  authDomain: "rgr-crm-941ab.firebaseapp.com",
  projectId: "rgr-crm-941ab",
  storageBucket: "rgr-crm-941ab.firebasestorage.app",
  messagingSenderId: "970218702810",
  appId: "1:970218702810:web:03409e8b0e971bb0b6e2e3"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* Google Drive API key — powers the deal photo carousel (reads folders shared
   as "Anyone with the link"). Same key as the GA Probates CRM. */
const GOOGLE_API_KEY = '<redacted>';

/* ---------------- Stages ---------------- */
const DEAL_STAGES = [
  { id: 'under_contract', label: 'Under Contract', color: '#8fc0e4' },
  { id: 'marketing', label: 'Marketing', color: '#e8c476' },
  { id: 'offers_in', label: 'Offers In', color: '#e0954a' },
  { id: 'assigned', label: 'Assigned', color: '#4caf82' },
  { id: 'closed', label: 'Closed', color: '#9e9e9e' },
  { id: 'dead', label: 'Dead', color: '#e07a77' }
];
const STAGE_MAP = Object.fromEntries(DEAL_STAGES.map(s => [s.id, s]));

/* ---------------- State ---------------- */
let tab = 'deals';
let stageFilter = 'all';
let buyerSearch = '';
let deals = [];
let buyers = [];
let openDealId = null;
let openBuyerId = null;

/* ---------------- Helpers ---------------- */
const $ = id => document.getElementById(id);
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function money(n) {
  if (n === '' || n == null || isNaN(+n)) return '—';
  return '$' + (+n).toLocaleString('en-US', { maximumFractionDigits: 0 });
}
function fmtDate(iso) {
  if (!iso) return '—';
  // Bare YYYY-MM-DD dates parse as UTC midnight → noon local avoids day-shift in US timezones
  const s = /^\d{4}-\d{2}-\d{2}$/.test(iso) ? iso + 'T12:00:00' : iso;
  const d = new Date(s);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}
function daysLeft(dateStr) {
  if (!dateStr) return null;
  const ms = new Date(dateStr) - Date.now();
  return Math.ceil(ms / 86400000);
}
function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;

}

/* Two-tap inline delete confirmation (automation + mobile friendly, no native dialogs) */
function armConfirm(btn, fn) {
  if (btn.dataset.armed) {
    delete btn.dataset.armed;
    btn.classList.remove('armed');
    btn.innerHTML = btn.dataset.orig || btn.innerHTML;
    fn();
  } else {
    btn.dataset.armed = '1';
    btn.dataset.orig = btn.innerHTML;
    btn.classList.add('armed');
    btn.innerHTML = '⚠️ Tap again to confirm';
    setTimeout(() => {
      if (btn.dataset.armed) {
        delete btn.dataset.armed;
        btn.classList.remove('armed');
        btn.innerHTML = btn.dataset.orig || btn.innerHTML;
      }
    }, 6000);
  }
}
function digitsOnly(p) { return String(p || '').replace(/\D/g, ''); }
function formatPhone(p) {
  const d = digitsOnly(p);
  if (d.length === 10) return `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
  if (d.length === 11 && d[0] === '1') return `(${d.slice(1,4)}) ${d.slice(4,7)}-${d.slice(7)}`;
  return p || '';
}

/* ================= Buyer Match Engine (SmartMatch-style) =================
   Scores each buyer against a deal. Sources are pluggable — the engine only
   cares about buyer.buyingZips[], buyer.buyingCounties[], buy box text,
   cashBuys12mo, and lastVerified. */
function buyerZips(b) {
  return String(b.buyingZip || '').split(/[,;\s]+/).map(z => z.trim()).filter(Boolean);
}
function buyerCounties(b) {
  return String(b.buyingCounty || '').split(/[,;/]+/).map(c => c.trim().toLowerCase()).filter(Boolean);
}
function matchScore(deal, buyer) {
  if (buyer.status === 'inactive') return { score: 0, why: [] };
  let score = 0;
  const why = [];
  const dz = String(deal.zip || '').trim();
  const dc = String(deal.county || '').trim().toLowerCase();
  // Geographic overlap is required — a buyer with no ZIP/county/city match
  // never qualifies, no matter their track record (Luca, 2026-10-16).
  let geo = false;
  // ZIP match — strongest signal
  if (dz && buyerZips(buyer).includes(dz)) { score += 40; why.push('Same ZIP'); geo = true; }
  // County match
  if (dc && buyerCounties(buyer).includes(dc)) { score += 25; why.push('Same county'); geo = true; }
  // City match
  const dCity = String(deal.city || '').trim().toLowerCase();
  if (dCity && String(buyer.buyingCity || '').toLowerCase().includes(dCity)) { score += 15; why.push('Same city'); geo = true; }
  if (!geo) return { score: 0, why: [] };
  // Buy box keyword overlap (property type / deal flavor)
  const box = String(buyer.buyBox || '').toLowerCase();
  const dealText = `${deal.propertyType || ''} ${deal.notes || ''}`.toLowerCase();
  const keywords = ['rental', 'flip', 'duplex', 'multi', 'land', 'rural', 'residential', 'commercial', 'fixer', 'turnkey'];
  const hits = keywords.filter(k => box.includes(k) && dealText.includes(k));
  if (hits.length) { score += Math.min(10, hits.length * 5); why.push('Buy box: ' + hits.slice(0, 2).join(', ')); }
  // Track record — cash buys in last 12 months
  const cb = +buyer.cashBuys12mo || 0;
  if (cb >= 3) { score += 10; why.push(cb + ' cash buys/12mo'); }
  else if (cb >= 1) { score += 6; why.push(cb + ' cash buy(s)/12mo'); }
  // Recency of verification
  if (buyer.lastVerified) {
    const ageDays = (Date.now() - new Date(buyer.lastVerified)) / 86400000;
    if (ageDays < 90) { score += 5; why.push('Recently verified'); }
  }
  return { score: Math.min(100, score), why };
}
function rankedBuyers(deal) {
  return buyers
    .map(b => ({ buyer: b, ...matchScore(deal, b) }))
    .filter(r => r.score > 0)
    .sort((a, b) => b.score - a.score);
}

/* ================= Sheet import ================= */
async function importBuyers() {
  showToast('Importing buyers from sheet…');
  try {
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.BUYERS_SHEET_ID}/values/${encodeURIComponent(CONFIG.BUYERS_TAB)}!A1:O500?key=${CONFIG.SHEETS_API_KEY}`;
    const res = await fetch(url);
    const data = await res.json();
    const rows = data.values || [];
    if (rows.length < 2) { showToast('No buyer rows found in sheet'); return; }
    const H = rows[0].map(h => h.trim().toLowerCase());
    const col = name => H.indexOf(name.toLowerCase());
    const cName = col('buyer name'), cType = col('type'), cPhone = col('phone'), cEmail = col('email'),
          cMail = col('mailing address'), cCity = col('buying city'), cCounty = col('buying county'),
          cZip = col('buying zip'), cBox = col('buy box'), cSrc = col('source'), cSrcD = col('source detail'),
          cCash = col('cash buys (12 mo)'), cAdded = col('date added'), cVer = col('last verified'), cNotes = col('notes');
    let added = 0, updated = 0;
    const existing = {};
    buyers.forEach(b => { existing[String(b.name || '').toLowerCase()] = b; });
    for (let i = 1; i < rows.length; i++) {
      const r = rows[i];
      const name = (r[cName] || '').trim();
      if (!name) continue;
      const rec = {
        name,
        type: (r[cType] || '').trim(),
        phone: (r[cPhone] || '').trim(),
        email: (r[cEmail] || '').trim(),
        mailingAddress: (r[cMail] || '').trim(),
        buyingCity: (r[cCity] || '').trim(),
        buyingCounty: (r[cCounty] || '').trim(),
        buyingZip: (r[cZip] || '').trim(),
        buyBox: (r[cBox] || '').trim(),
        source: (r[cSrc] || '').trim(),
        sourceDetail: (r[cSrcD] || '').trim(),
        cashBuys12mo: (r[cCash] || '').trim(),
        dateAdded: (r[cAdded] || '').trim(),
        lastVerified: (r[cVer] || '').trim(),
        notes: (r[cNotes] || '').trim(),
        status: /inactive|not buying/i.test(r[cNotes] || '') ? 'inactive' : 'active',
        updatedAt: new Date().toISOString()
      };
      const ex = existing[name.toLowerCase()];
      if (ex) { await db.collection('dispoBuyers').doc(ex.id).set({ ...ex, ...rec }, { merge: true }); updated++; }
      else { await db.collection('dispoBuyers').add(rec); added++; }
    }
    await loadAll();
    renderBuyers();
    showToast(`Import done: ${added} added, ${updated} updated`);
  } catch (e) {
    console.error(e);
    showToast('Import failed — check connection');
  }
}

// Mobile: fade header on scroll down, return on scroll up
(function initMobileHeaderFade() {
  let lastY = 0, ticking = false;
  window.addEventListener('scroll', () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      ticking = false;
      if (window.innerWidth > 640) return;
      const header = $('site-header');
      if (!header) return;
      const y = window.scrollY;
      if (y > 120 && y > lastY + 4) header.classList.add('header-hidden');
      else if (y < lastY - 4 || y <= 120) header.classList.remove('header-hidden');
      lastY = y;
    });
  }, { passive: true });
})();

async function deleteOffer(dealId, offerId) {
  await db.collection('dispoOffers').doc(offerId).delete();

  openDeal(dealId);
}
async function deleteDeal(id) {
  const d = deals.find(x => x.id === id);
  showToast('Deleting deal…');
  const wipe = async (coll) => {
    const snap = await db.collection(coll).where('dealId', '==', id).get();
    for (const doc of snap.docs) await db.collection(coll).doc(doc.id).delete();
  };
  await wipe('dispoOffers');
  await wipe('dispoComps');
  await wipe('dispoActivity');
  await db.collection('dispoDeals').doc(id).delete();
  showToast('Deal deleted');
  await loadAll();
  switchTab('deals');
}
async function setStage(id, stage) {
  await db.collection('dispoDeals').doc(id).set({ stage, updatedAt: new Date().toISOString() }, { merge: true });
  await logActivity(id, `Stage → ${STAGE_MAP[stage].label}`);
  showToast(`Stage → ${STAGE_MAP[stage].label}`);
  await loadAll(); openDeal(id);
}

/* ---------------- Deal photos (Google Drive folder link) ---------------- */
const driveCache = {}; // folderId -> { status, files, name }
let editingDriveFor = null;
function extractDriveFolderId(url) {
  if (!url) return null;
  const m = url.match(/folders\/([a-zA-Z0-9_-]+)/);
  return m ? m[1] : null;
}
async function saveDriveLink(dealId) {
  const inp = document.getElementById('drive-link-input');
  const url = (inp.value || '').trim();
  if (!url) { showToast('Paste a Drive folder link first'); return; }
  if (!extractDriveFolderId(url)) { showToast("That doesn't look like a Drive folder link", 'error'); return; }
  await db.collection('dispoDeals').doc(dealId).set({ driveFolderUrl: url, updatedAt: new Date().toISOString() }, { merge: true });
  editingDriveFor = null;
  await loadAll(); openDeal(dealId);
  showToast('Photo folder saved');
}
async function fetchDrivePhotos(dealId, folderUrl) {
  const container = document.getElementById('drive-carousel-' + dealId);
  if (!container) return;
  const folderId = extractDriveFolderId(folderUrl);
  if (!folderId) { container.innerHTML = `<div class="drive-carousel-msg">Couldn't read a folder link from that URL.</div>`; return; }
  if (driveCache[folderId] && driveCache[folderId].status === 'done') { renderDriveCarousel(dealId, driveCache[folderId].files); return; }
  if (driveCache[folderId] && driveCache[folderId].status === 'error') {
    container.innerHTML = `<div class="drive-carousel-msg">Couldn't load photos — make sure the folder is shared as "Anyone with the link".</div>`; return;
  }
  container.innerHTML = `<div class="drive-carousel-msg">Loading photos…</div>`;
  try {
    const q = encodeURIComponent(`'${folderId}' in parents and mimeType contains 'image/' and trashed = false`);
    const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&key=${GOOGLE_API_KEY}&fields=files(id,name,thumbnailLink)&pageSize=50`);
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    const files = data.files || [];
    driveCache[folderId] = { status: 'done', files };
    renderDriveCarousel(dealId, files);
  } catch (e) {
    driveCache[folderId] = { status: 'error' };
    container.innerHTML = `<div class="drive-carousel-msg">Couldn't load photos — make sure the folder is shared as "Anyone with the link".</div>`;
  }
}
function renderDriveCarousel(dealId, files) {
  const container = document.getElementById('drive-carousel-' + dealId);
  if (!container) return;
  if (!files.length) { container.innerHTML = `<div class="drive-carousel-msg">No images found in that folder yet.</div>`; return; }
  container.innerHTML = files.map(f => `
    <a href="https://drive.google.com/file/d/${f.id}/view" target="_blank" rel="noopener" class="drive-thumb-link" title="${esc(f.name)}">
      <img src="${f.thumbnailLink}" class="drive-thumb" loading="lazy" />
    </a>`).join('');
}
async function fetchDriveFolderName(dealId, folderUrl) {
  const linkEl = document.getElementById('drive-link-name-' + dealId);
  if (!linkEl) return;
  const folderId = extractDriveFolderId(folderUrl);
  if (!folderId) { linkEl.textContent = '📁 Open Photos'; return; }
  if (driveCache[folderId] && driveCache[folderId].name) { linkEl.textContent = '📁 ' + driveCache[folderId].name; return; }
  try {
    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${folderId}?key=${GOOGLE_API_KEY}&fields=name`);
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    driveCache[folderId] = { ...(driveCache[folderId] || {}), name: data.name };
    const stillThere = document.getElementById('drive-link-name-' + dealId);
    if (stillThere) stillThere.textContent = '📁 ' + data.name;
  } catch (e) {
    const stillThere = document.getElementById('drive-link-name-' + dealId);
    if (stillThere) stillThere.textContent = '📁 Open Photos';
  }
}

function maoHTML(d) {
  const pct = +(d.maoPct || 70);
  const arv = +d.arv || 0, repairs = +d.repairEst || 0, fee = +d.assignmentFee || 0;
  const mao = arv ? Math.round(arv * pct / 100 - repairs - fee) : null;
  const contract = +d.contractPrice || 0;
  const verdict = (mao != null && contract) ? (contract <= mao ? 'good' : 'bad') : null;
  return `<div style="background:rgba(0,0,0,.25);border:1px solid #22385a;border-radius:12px;padding:14px;margin-bottom:6px;">
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
      <div class="form-field" style="max-width:130px;"><label>MAO % of ARV</label>
        <input type="number" id="mao-pct" value="${pct}" min="10" max="100" onchange="updateMaoPct('${d.id}', this.value)" style="width:100%;padding:9px 10px;border-radius:10px;border:1px solid #22385a;background:#0b1626;color:#e8c476;font-size:15px;font-weight:700;">
      </div>
      <div>
        <div style="font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#8a97a8;">Max Allowable Offer</div>
        <div style="font-size:24px;font-weight:800;color:#e8c476;font-family:'JetBrains Mono',monospace;">${mao != null ? money(mao) : '—'}</div>
      </div>
      ${verdict ? `<div style="font-size:13px;font-weight:700;color:${verdict === 'good' ? '#4caf82' : '#e07a77'};">${verdict === 'good' ? '✓ Contract at/below MAO' : '⚠ Contract above MAO by ' + money(contract - mao)}</div>` : ''}
    </div>
    <div style="font-size:12px;color:#8a97a8;margin-top:8px;">${pct}% × ${money(arv)} − ${money(repairs)} repairs − ${money(fee)} fee</div>
  </div>`;
}
async function updateMaoPct(dealId, pct) {
  await db.collection('dispoDeals').doc(dealId).set({ maoPct: +pct || 70 }, { merge: true });
  const d = deals.find(x => x.id === dealId);
  if (d) d.maoPct = +pct || 70;
  const box = document.getElementById('mao-box');

}

/* ================= Find Buyers (InvestorBase search) =================
   DISPO MANAGER handoff contract (InvestorBase is the ONLY buyer source):
   - Luca queues a search here → doc in `dispoBuyerSearches`:
     { address, propertyType, radiusMiles, monthsBack: 12 (hardcoded), notes,
       status: 'queued', lat, lng, createdAt }
     Lookback never exceeds 12 months — no user control.
   - DISPO MANAGER runs the InvestorBase pull per SOP (skip-trace-and-save before
     search, buyer-type filters matched to propertyType, radius from 0.5 mi
     expanding until ≥10 buyers, no cap), creates/updates `dispoBuyers` docs
     (with firstName/lastName + boughtPropertyAddress/Price/Details), and links
     each buyer to the search AND the deal via `dispoBuyerSearchResults`:
     { searchId, dealId, buyerId, createdAt }
     (legacy purchase fields buyerName/purchaseAddress/soldPrice/soldDate/lat/lng
     may also be present on result docs for the map — rendered defensively).
   - She flips the search status to 'complete' when done.
   - In-app: "🔗 Link buyers to deal" on a search links all its pushed buyers at
     once; per-result "🔗 Deal" links one; buyer card "🔗 Link to Deal" links a
     buyer directly. Deal detail shows them under "🔗 Pulled Buyers". */
async function geocodeAddress(addr) {
  try {
    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(addr);
    const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
    const data = await res.json();
    if (data && data.length) return { lat: +data[0].lat, lng: +data[0].lon };
  } catch (e) {}
  return null;
}

async function queueBuyerSearch({ address, propertyType, radiusMiles, notes, dealId }) {
  showToast('Locating property…');
  const geo = await geocodeAddress(address + ', USA');
  const rec = {
    address, propertyType: propertyType || '', radiusMiles: radiusMiles || 0.5, monthsBack: 12, notes: notes || '',
    status: 'queued',
    lat: geo ? geo.lat : '', lng: geo ? geo.lng : '',

  };
  if (dealId) rec.dealId = dealId;
  const ref = await db.collection('dispoBuyerSearches').add(rec);
  showToast('Search queued — DISPO MANAGER is on it');
  return ref;
}

function initBuyerMap(s, results) {
  try {
    if (window._buyerMap) { window._buyerMap.remove(); window._buyerMap = null; }
    const map = L.map('buyer-map').setView([s.lat, s.lng], 13);
    window._buyerMap = map;
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
    // Radius circle
    L.circle([s.lat, s.lng], {
      radius: s.radiusMiles * 1609.34, color: '#d4a843', weight: 2,
      fillColor: '#d4a843', fillOpacity: 0.08, dashArray: '6 6'
    }).addTo(map);
    // Subject marker (gold)
    const starIcon = L.divIcon({
      className: '', html: '<div style="font-size:26px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6));">⭐</div>',
      iconSize: [26, 26], iconAnchor: [13, 13]
    });
    L.marker([s.lat, s.lng], { icon: starIcon }).addTo(map)
      .bindPopup(`<b>Subject</b><br>${esc(s.address)}`);
    // Buyer purchase markers (blue)
    const dotIcon = L.divIcon({
      className: '', html: '<div style="width:16px;height:16px;border-radius:50%;background:#4a9fe0;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.5);"></div>',
      iconSize: [16, 16], iconAnchor: [8, 8]
    });
    const pts = [[s.lat, s.lng]];
    results.forEach(r => {
      if (!r.lat || !r.lng) return;
      pts.push([r.lat, r.lng]);
      L.marker([r.lat, r.lng], { icon: dotIcon }).addTo(map)
        .bindPopup(`<b>${esc(r.buyerName || '')}</b><br>💰 ${money(r.soldPrice)} · ${esc(fmtDate(r.soldDate))}<br>📍 ${esc(r.purchaseAddress || '')}`);
    });
    if (pts.length > 1) map.fitBounds(pts, { padding: [30, 30] });
    setTimeout(() => map.invalidateSize(), 300);
  } catch (e) { console.error('map failed', e); }
}
function buyerPinColor(type) {
  const t = (type || '').toLowerCase();
  if (/llc|corp|inc\b|reit|partner|entity|holding/.test(t)) return '#4caf82';
  if (/individual/.test(t)) return '#4a9fe0';
  if (/trust/.test(t)) return '#c084fc';
  return '#8a97a8';
}
function buyerDotIcon(color) {

    html: '<div style="width:18px;height:18px;border-radius:50%;background:' + color + ';border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.5);"></div>',

async function initDealBuyerMap(deal, pulledBuyers) {
  const mapEl = document.getElementById('deal-buyer-map');
  const statusEl = document.getElementById('deal-map-status');
  const countEl = document.getElementById('deal-map-count');
  if (!mapEl || typeof L === 'undefined') return;
  const setStatus = txt => { if (statusEl) statusEl.textContent = txt || ''; };
  try {
    if (window._dealBuyerMap) { window._dealBuyerMap.remove(); window._dealBuyerMap = null; }
    if (!pulledBuyers.length) {
      mapEl.innerHTML = '<div class="timeline-empty">No pulled buyers linked yet — link them from 🔍 Find Buyers.</div>';
      return;
    }
    // Deal location: linked search lat/lng first, else geocode the deal address
    let dealGeo = null;
    const searchIds = [...new Set(pulledBuyers.map(pb => pb.searchId).filter(Boolean))];
    for (const sid of searchIds) {
      try {
        const sdoc = await db.collection('dispoBuyerSearches').doc(sid).get();
        const s = sdoc.exists ? sdoc.data() : null;
        if (s && s.lat && s.lng) { dealGeo = { lat: +s.lat, lng: +s.lng }; break; }
      } catch (e) {}
    }
    if (!dealGeo) {
      const daddr = [deal.address, deal.city, deal.state, deal.zip].filter(Boolean).join(', ');
      if (daddr) { try { dealGeo = await geocodeAddress(daddr + ', USA'); } catch (e) {} }
    }
    // Buyer pins: cached coords first, then Nominatim at max 1 req/sec, caching back to the buyer doc
    const pins = [];
    const toLocate = [];
    pulledBuyers.forEach(pb => {
      const b = pb._buyer;
      const lat = (b && b.buyerLat) || pb.lat || '';
      const lng = (b && b.buyerLng) || pb.lng || '';
      if (lat && lng) pins.push({ pb, lat: +lat, lng: +lng });
      else toLocate.push(pb);
    });
    if (toLocate.length) setStatus('Locating ' + toLocate.length + ' buyer' + (toLocate.length === 1 ? '' : 's') + ' on map…');
    for (const pb of toLocate) {
      const b = pb._buyer;
      const addr = (b && b.boughtPropertyAddress) || pb.boughtPropertyAddress || pb.purchaseAddress || '';
      if (addr) {
        let geo = null;
        try { geo = await geocodeAddress(addr + ', USA'); } catch (e) {}
        try { await new Promise(r => setTimeout(r, 1100)); } catch (e) {}
        if (geo && geo.lat && geo.lng) {
          pins.push({ pb, lat: +geo.lat, lng: +geo.lng });
          if (b && b.id) {
            try {
              await db.collection('dispoBuyers').doc(b.id).set({ buyerLat: +geo.lat, buyerLng: +geo.lng }, { merge: true });
              b.buyerLat = +geo.lat; b.buyerLng = +geo.lng;
            } catch (e) {}
          }
        }
      }
    }
    setStatus(pins.length ? '' : 'Could not locate any buyer addresses on the map.');
    if (countEl) countEl.textContent = '(' + pins.length + ')';
    if (!dealGeo && !pins.length) {
      mapEl.innerHTML = '<div class="timeline-empty">No mappable locations yet.</div>';
      return;
    }
    const map = L.map('deal-buyer-map').setView(
      dealGeo ? [dealGeo.lat, dealGeo.lng] : [pins[0].lat, pins[0].lng], 11);
    window._dealBuyerMap = map;
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
    const pts = [];
    if (dealGeo) {
      pts.push([dealGeo.lat, dealGeo.lng]);
      const starIcon = L.divIcon({
        className: '',
        html: '<div style="font-size:26px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6));">⭐</div>',
        iconSize: [26, 26], iconAnchor: [13, 13]
      });
      L.marker([dealGeo.lat, dealGeo.lng], { icon: starIcon }).addTo(map)
        .bindPopup('<b>🏠 Deal</b><br>' + esc(deal.address || ''));
    }
    pins.forEach(({ pb, lat, lng }) => {
      const b = pb._buyer;
      const nm = (b && (b.firstName || b.lastName) ? [b.firstName, b.lastName].filter(Boolean).join(' ') : (b && b.name)) || pb.buyerName || 'Unknown buyer';
      const addr = (b && b.boughtPropertyAddress) || pb.boughtPropertyAddress || pb.purchaseAddress || '';
      const price = (b && b.boughtPropertyPrice) || pb.boughtPropertyPrice || (pb.soldPrice ? String(pb.soldPrice) : '');
      pts.push([lat, lng]);
      const popup = '<b>' + esc(nm) + '</b>'
        + (b && b.phone ? '<br>📞 ' + esc(b.phone) : '')
        + (addr ? '<br>📍 ' + esc(addr) : '')
        + (price ? '<br>💰 ' + esc(price) : '');
      L.marker([lat, lng], { icon: buyerDotIcon(buyerPinColor(b && b.type)) }).addTo(map).bindPopup(popup);
    });
    if (pts.length > 1) map.fitBounds(pts, { padding: [30, 30] });
    setTimeout(() => map.invalidateSize(), 300);
  } catch (e) { console.error('deal buyer map failed', e); }
}

async function pushResultToBuyers(resultId) {  const doc = await db.collection('dispoBuyerSearchResults').doc(resultId).get();

  const r = doc.data();

  const nameParts = String(r.buyerName || '').trim().split(/\s+/).filter(Boolean);
  const boughtFields = {
    firstName: nameParts[0] || '', lastName: nameParts.slice(1).join(' ') || '',
    boughtPropertyAddress: r.purchaseAddress || '',

    boughtPropertyDetails: [r.soldDate ? 'Sold ' + fmtDate(r.soldDate) : '', r.purchaseAddress ? 'Cash purchase' : ''].filter(Boolean).join(' · ')
  };
  let buyerId;
  if (existing) {
    buyerId = existing.id;
    await db.collection('dispoBuyers').doc(buyerId).set({
      ...boughtFields,
      sourceDetail: ((existing.sourceDetail || '') + ` | Buyer search: ${r.purchaseAddress} ${money(r.soldPrice)} (${fmtDate(r.soldDate)})`).trim(),
      updatedAt: new Date().toISOString()
    }, { merge: true });
  } else {
    const ref = await db.collection('dispoBuyers').add({
      name: r.buyerName, type: '', phone: '', email: '', mailingAddress: '',
      buyingCity: '', buyingCounty: '', buyingZip: '',
      buyBox: '', source: 'Buyer Search', sourceDetail: `${r.purchaseAddress} — cash ${money(r.soldPrice)} (${fmtDate(r.soldDate)})`,
      cashBuys12mo: '1', dateAdded: new Date().toISOString().slice(0, 10),
      lastVerified: new Date().toISOString().slice(0, 10),
      notes: '', status: 'active', ...boughtFields, updatedAt: new Date().toISOString()
    });
    buyerId = ref.id;
  }
  const sdoc0 = r.searchId ? await db.collection('dispoBuyerSearches').doc(r.searchId).get() : null;
  const autoDealId = sdoc0 && sdoc0.exists ? (sdoc0.data().dealId || '') : '';
  await db.collection('dispoBuyerSearchResults').doc(resultId).set(
    autoDealId ? { buyerId, dealId: autoDealId } : { buyerId }, { merge: true });
  showToast((existing ? 'Linked to existing buyer' : 'Buyer added to Buyers DB') + (autoDealId ? ' — linked to deal' : ''));
  await loadAll();
  const sdoc = await db.collection('dispoBuyerSearches').doc(r.searchId).get();
  if (sdoc.exists) openBuyerSearch(r.searchId);
}

async function renderKPIs() {
  $('content').innerHTML = '<div class="empty-state">Loading KPIs…</div>';
  const offersSnap = await db.collection('dispoOffers').get();
  const offers = offersSnap.docs.map(o => o.data());
  const active = deals.filter(d => !['closed', 'dead'].includes(d.stage));
  const closedDeals = deals.filter(d => d.stage === 'closed');
  const assignedDeals = deals.filter(d => d.stage === 'assigned');
  const totalFees = closedDeals.reduce((s, d) => s + (+d.assignmentFee || 0), 0);
  // Avg days under contract → assigned/closed
  let daySum = 0, dayN = 0;
  deals.forEach(d => {
    if (['assigned', 'closed'].includes(d.stage) && d.createdAt && d.updatedAt) {
      const days = (new Date(d.updatedAt) - new Date(d.createdAt)) / 86400000;
      if (days >= 0 && days < 365) { daySum += days; dayN++; }
    }
  });
  const stat = (label, val, sub) => `
    <div class="num-box" style="padding:16px;">
      <div class="l">${label}</div>
      <div class="v" style="font-size:26px;">${val}</div>
      ${sub ? `<div style="font-size:12px;color:#8a97a8;margin-top:4px;">${sub}</div>` : ''}
    </div>`;
  $('content').innerHTML = `
    <div class="num-grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));">
      ${stat('Active deals', active.length, 'under contract → offers in')}
      ${stat('Total offers', offers.length, 'across all deals')}
      ${stat('Assigned', assignedDeals.length, '')}
      ${stat('Closed', closedDeals.length, '')}
      ${stat('Fees collected', money(totalFees), 'closed deals')}
      ${stat('Avg days to assign', dayN ? Math.round(daySum / dayN) : '—', dayN ? `over ${dayN} deals` : '')}
    </div>
    <div class="section-label">Deals by stage</div>
    ${DEAL_STAGES.map(s => {
      const c = deals.filter(d => d.stage === s.id).length;
      const pct = deals.length ? Math.round(c / deals.length * 100) : 0;
      return `<div style="margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;">
          <span style="color:${s.color};font-weight:700;">${s.label}</span><span class="mono">${c}</span>
        </div>
        <div style="height:8px;background:#16294a;border-radius:4px;overflow:hidden;">
          <div style="height:100%;width:${pct}%;background:${s.color};border-radius:4px;"></div>
        </div>
      </div>`;
    }).join('')}
    <div class="section-label">Recent offers</div>
    ${offers.sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || '')).slice(0, 10).map(o => {
      const d = deals.find(x => x.id === o.dealId);
      return `<div class="match-row"><div class="match-info">
        <div class="n">${money(o.amount)} <span style="font-weight:400;color:#8a97a8;">— ${esc(o.buyerName || '')}</span></div>
        <div class="w">${esc(d ? d.address : '')} · ${esc(fmtDate((o.createdAt || '').slice(0, 10)))}</div>
      </div></div>`;
    }).join('') || '<div class="timeline-empty">No offers yet.</div>'}`;
}

let dialer = null; // {dealId, queue:[{buyer,score,why}], idx, outcomes:{}}
function startDialer(dealId) {
  const d = deals.find(x => x.id === dealId);
  if (!d) return;
  const queue = rankedBuyers(d);
  if (!queue.length) { showToast('No matched buyers to call'); return; }
  dialer = { dealId, queue, idx: 0, outcomes: {} };
  renderDealDialer();
}
function renderDealDialer() {
  const d = deals.find(x => x.id === dialer.dealId);
  const item = dialer.queue[dialer.idx];
  const b = item.buyer;
  const prev = dialer.outcomes[b.id];
  const outs = ['Interested', 'Made Offer', 'Follow-up', 'No Answer', 'Not Interested', 'Bad Number'];

        <div style="font-size:14px;font-weight:700;margin-top:2px;">${esc(d.address)}</div>

    <div style="flex:1;overflow-y:auto;padding:6px 16px 20px;max-width:560px;width:100%;margin:0 auto;">
      <div class="detail-card" style="text-align:center;">
        <div style="font-size:22px;font-weight:800;">${esc(b.name)}</div>
        <div style="font-size:13px;color:#8a97a8;margin-top:4px;">${esc(item.why.join(' · '))}</div>
        ${b.buyBox ? `<div style="font-size:13px;color:#aeb9c7;font-style:italic;margin-top:8px;">🎯 ${esc(b.buyBox)}</div>` : ''}
        ${b.phone
          ? `<a href="tel:${digitsOnly(b.phone)}" class="btn-gold" style="display:block;text-decoration:none;margin:18px 0 6px;min-height:60px;display:flex;align-items:center;justify-content:center;font-size:19px;">📞 ${esc(formatPhone(b.phone))}</a>`
          : '<div style="color:#e07a77;font-weight:700;margin:18px 0;">⚠️ No phone — needs skip trace</div>'}
        ${b.email ? `<div style="font-size:14px;color:#aeb9c7;">✉️ ${esc(b.email)}</div>` : ''}
      </div>
      <div class="detail-card">
        <div class="section-label" style="margin-top:0;">Log outcome</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          ${outs.map(o => `<button class="btn-ghost" data-outcome="${o}" style="${prev && prev.outcome === o ? 'border-color:#d4a843;color:#e8c476;background:rgba(212,168,67,.1);' : ''}">${o}</button>`).join('')}
        </div>
        <div class="form-field" style="margin-top:10px;"><textarea id="dialer-note" placeholder="Call notes…" style="width:100%;padding:12px;border-radius:10px;border:1px solid #22385a;background:#0b1626;color:#e9edf3;font-size:15px;min-height:64px;">${esc((prev && prev.note) || '')}</textarea></div>
      </div>
    </div>
    <div style="display:flex;border-top:1px solid #16283f;background:#0d1b2e;padding:10px 12px calc(10px + env(safe-area-inset-bottom));gap:10px;max-width:560px;width:100%;margin:0 auto;">
      <button class="btn-ghost" style="flex:1;min-height:52px;" ${dialer.idx === 0 ? 'disabled style="flex:1;min-height:52px;opacity:.4;"' : ''} onclick="dialerNav(-1)">‹ Prev</button>
      <button class="btn-gold" style="flex:2;min-height:52px;" onclick="dialerNext()">Save & Next ›</button>
    </div>
  </div>`);
  document.querySelectorAll('#dispo-dialer [data-outcome]').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('#dispo-dialer [data-outcome]').forEach(x => { x.style.borderColor = ''; x.style.color = ''; x.style.background = ''; });
      btn.style.borderColor = '#d4a843'; btn.style.color = '#e8c476'; btn.style.background = 'rgba(212,168,67,.1)';
      btn.dataset.selected = '1';
      document.querySelectorAll('#dispo-dialer [data-outcome]').forEach(x => { if (x !== btn) delete x.dataset.selected; });
    };
    if (prev && prev.outcome === btn.dataset.outcome) btn.dataset.selected = '1';
  });
}
function dialerCurrentOutcome() {
  const sel = document.querySelector('#dispo-dialer [data-outcome][data-selected]');
  const note = ($('dialer-note') || {}).value?.trim() || '';
  return { outcome: sel ? sel.dataset.outcome : '', note };
}
async function persistDialerOutcome() {
  const item = dialer.queue[dialer.idx];
  const { outcome, note } = dialerCurrentOutcome();
  if (!outcome && !note) return;
  dialer.outcomes[item.buyer.id] = { outcome, note };
  const d = deals.find(x => x.id === dialer.dealId);
  const txt = `📞 ${item.buyer.name}: ${outcome || 'note'}${note ? ' — ' + note : ''}`;
  await logActivity(dialer.dealId, txt);
  await db.collection('dispoBuyers').doc(item.buyer.id).set({
    lastContact: new Date().toISOString().slice(0, 10),
    lastOutcome: outcome || '',
    updatedAt: new Date().toISOString()
  }, { merge: true });
  if (outcome === 'Bad Number') {
    await db.collection('dispoBuyers').doc(item.buyer.id).set({ status: 'needs_retrace' }, { merge: true });
  }
}
async function dialerNext() {
  await persistDialerOutcome();
  document.getElementById('dispo-dialer').remove();
  if (dialer.idx < dialer.queue.length - 1) {
    dialer.idx++;
    renderDealDialer();
  } else {
    const n = Object.keys(dialer.outcomes).length;
    showToast(`Session done — ${n} buyer${n === 1 ? '' : 's'} logged`);
    dialer = null;
    await loadAll();
  }
}
function dialerNav(dir) {
  persistDialerOutcome().then(() => {
    document.getElementById('dispo-dialer').remove();
    dialer.idx = Math.max(0, Math.min(dialer.queue.length - 1, dialer.idx + dir));
    renderDealDialer();
  });
}
function closeDialer() {
  persistDialerOutcome().then(() => {
    const el = document.getElementById('dispo-dialer');
    if (el) el.remove();
    dialer = null;
    loadAll();
  });
}

      <div class="section-label">Bought Property (InvestorBase)</div>
      <div class="form-grid">
        ${fld('firstName', 'First name', b.firstName)}
        ${fld('lastName', 'Last name', b.lastName)}
        ${fld('boughtPropertyAddress', 'Bought property address', b.boughtPropertyAddress)}
        ${fld('boughtPropertyPrice', 'Bought price', b.boughtPropertyPrice)}
      </div>
      <div class="form-field" style="margin-top:10px;"><label>Property details (beds / baths / sqft / year built…)</label><textarea id="bf-boughtPropertyDetails" placeholder="e.g. 3bd/2ba, 1,450 sqft, built 1987">${esc(b.boughtPropertyDetails || '')}</textarea></div>
      <div class="form-grid" style="margin-top:10px;">
        ${fld('source', 'Source', b.source)}

        <div class="form-field"><label>Status</label><select id="bf-status">

        </select></div>
      </div>
      <div class="form-field" style="margin-top:10px;"><label>Notes</label><textarea id="bf-notes">${esc(b.notes || '')}</textarea></div>
      <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn-gold" onclick="saveBuyerForm('${b.id || ''}')">💾 Save Buyer</button>
        ${b.id ? `<button class="btn-ghost" onclick="openBuyer('${b.id}')">Cancel</button>` : `<button class="btn-ghost" onclick="switchTab('buyers')">Cancel</button>`}
      </div>
    </div>
  </div>`;
  window.scrollTo(0, 0);
}
async function saveBuyerForm(id) {
  const v = k => ($('bf-' + k) || {}).value?.trim() || '';
  const rec = {
    name: v('name'), type: v('type'), phone: v('phone'), email: v('email'), mailingAddress: v('mailingAddress'),
    buyingCity: v('buyingCity'), buyingCounty: v('buyingCounty'), buyingZip: v('buyingZip'),
    cashBuys12mo: v('cashBuys12mo'), buyBox: $('bf-buyBox').value.trim(),
    firstName: v('firstName'), lastName: v('lastName'),
    boughtPropertyAddress: v('boughtPropertyAddress'), boughtPropertyPrice: v('boughtPropertyPrice'),
    boughtPropertyDetails: ($('bf-boughtPropertyDetails') || {}).value?.trim() || '',
    source: v('source'), sourceDetail: v('sourceDetail'), lastVerified: v('lastVerified'),
    status: $('bf-status').value, notes: $('bf-notes').value.trim(),
    updatedAt: new Date().toISOString()
  };
  if (!rec.name) { showToast('Buyer name is required'); return; }
  if (id) {
    await db.collection('dispoBuyers').doc(id).set(rec, { merge: true });
    showToast('Buyer saved');
    await loadAll(); openBuyer(id);
  } else {
    rec.dateAdded = new Date().toISOString().slice(0, 10);
    await db.collection('dispoBuyers').add(rec);
    showToast('Buyer added');
    await loadAll(); switchTab('buyers');
  }
}

    .map(d => ({ deal: d, ...matchScore(d, b) }))

  $('content').innerHTML = `<div class="detail-wrap">

    <div class="detail-card">

        <div>
          <h2>${esc(b.name)}</h2>
          <div class="addr-sub">${esc(b.type || '')}${b.mailingAddress ? ' · ' + esc(b.mailingAddress) : ''}</div>
        </div>
        ${b.status === 'inactive' ? '<span class="inactive-tag">Inactive</span>' : ''}
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 4px;">
        ${b.phone ? `<a class="btn-gold" href="tel:${digitsOnly(b.phone)}" style="text-decoration:none;">📞 ${esc(formatPhone(b.phone))}</a>` : '<span style="color:#e07a77;font-size:14px;font-weight:700;">⚠️ No phone — needs skip trace (DISPO MANAGER)</span>'}
        ${b.email ? `<a class="btn-ghost" href="mailto:${esc(b.email)}" style="text-decoration:none;">✉️ Email</a>` : ''}
      </div>
      <div class="section-label">Buy Box</div>
      <div style="font-size:14px;color:#aeb9c7;font-style:italic;">🎯 ${esc(b.buyBox || 'Not recorded')}</div>
      <div class="num-grid" style="margin-top:14px;">
        <div class="num-box"><div class="l">Cash buys / 12mo</div><div class="v">${esc(b.cashBuys12mo || '—')}</div></div>
        <div class="num-box"><div class="l">Territory</div><div class="v" style="font-size:14px;">${esc([b.buyingCity, b.buyingCounty, b.buyingZip].filter(Boolean).join(' · ') || '—')}</div></div>
      </div>
      ${(b.boughtPropertyAddress || b.boughtPropertyPrice || b.boughtPropertyDetails || b.firstName || b.lastName) ? `
      <div class="section-label">🏠 Bought Property (InvestorBase)</div>
      <div style="font-size:14px;color:#aeb9c7;line-height:1.8;">
        ${[b.firstName, b.lastName].filter(Boolean).join(' ') ? '👤 ' + esc([b.firstName, b.lastName].filter(Boolean).join(' ')) + '<br>' : ''}
        ${b.boughtPropertyAddress ? '📍 ' + esc(b.boughtPropertyAddress) + '<br>' : ''}
        ${b.boughtPropertyPrice ? '💰 ' + esc(b.boughtPropertyPrice) + '<br>' : ''}
        ${b.boughtPropertyDetails ? esc(b.boughtPropertyDetails) : ''}

      <div class="section-label">Provenance</div>
      <div style="font-size:13px;color:#8a97a8;line-height:1.7;">
        Source: ${esc(b.source || '—')}${b.sourceDetail ? '<br>' + esc(b.sourceDetail) : ''}<br>
        Added: ${esc(fmtDate(b.dateAdded))} · Verified: ${esc(fmtDate(b.lastVerified))}
      </div>
      ${b.notes ? `<div class="section-label">Notes</div><div style="font-size:14px;color:#aeb9c7;line-height:1.6;white-space:pre-wrap;">${esc(b.notes)}</div>` : ''}
      <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;"><button class="btn-ghost" onclick='showBuyerForm(${JSON.stringify(b.id)})'>✏️ Edit Buyer</button><button class="btn-ghost" onclick="linkBuyerToDeal('${b.id}')">🔗 Link to Deal</button></div>
    </div>
    <div class="detail-card">
      <h2 style="font-size:18px;">📦 Matching Deals <span style="color:#8a97a8;font-size:13px;font-weight:400;">(${matched.length})</span></h2>
      ${matched.length ? matched.map(m => `
        <div class="match-row" onclick="openDeal('${m.deal.id}')" style="cursor:pointer;">
          <div class="match-score">${m.score}</div>
          <div class="match-info">
            <div class="n">${esc(m.deal.address)}</div>
            <div class="w">${esc(m.why.join(' · '))}</div>
          </div>
        </div>`).join('') : '<div class="timeline-empty">No current deals match this buyer.</div>'}
    </div>
  </div>`;
  window.scrollTo(0, 0);
}

/* ================= 📞 DispoHub Dialer =================
   Buyer call dialer — same single-column format as the CRM dialers
   (buyer card on top, Notes + disposition buttons below).
   4-day cycle: D1 Double Dial+VM+SMS → D2 Double Dial+VM+SMS →
   D3 rest (skip) → D4 Double Dial+VM+SMS (send deal) → restart.
   Calls log to `dispoBuyerCalls`; per-buyer cycle state lives on the
   buyer doc (dialDay, dialNextDate, dialStatus, lastDialDispo, lastDialAt).
   dialStatus: 'paused' (Not Active — resumable), 'bad_number' / 'dnc' /
   'interested' (permanently out of the queue). */
const DD_OUTCOMES = [
  { id: 'no_answer', label: 'No Answer' },
  { id: 'interested', label: 'Interested' },
  { id: 'not_active', label: 'Not Active' },
  { id: 'bad_number', label: 'Bad Number' },
  { id: 'dnc', label: 'DNC' }
];
const DD_CADENCE = [
  { day: 1, action: 'Double Dial + VM + SMS' },
  { day: 2, action: 'Double Dial + VM + SMS' },
  { day: 3, action: 'Rest day — skip' },
  { day: 4, action: 'Double Dial + VM + SMS (send deal)' }
];
let ddBooted = false;
let ddQueue = [];
let ddIdx = 0;
let ddDealFilter = 'all';
let ddStarted = false;
let ddShowCadence = false;
let ddBusy = false;
let ddStats = null;
function ddResetStats() { ddStats = { called: 0, no_answer: 0, interested: 0, not_active: 0, bad_number: 0, dnc: 0 }; }
function ddBuyerName(b) {
  const fl = [b.firstName, b.lastName].filter(Boolean).join(' ').trim();
  return fl || b.name || 'Unknown buyer';
}
function ddOutcomeLabel(id) {
  const o = DD_OUTCOMES.find(o => o.id === id);
  return o ? o.label : (id || '—');
}
/* Callable = has a phone, not inactive, not DNC/bad-number/interested/paused */
function ddCallable(b) {
  if (!b || b.status === 'inactive') return false;
  if (['dnc', 'bad_number', 'interested', 'paused'].includes(b.dialStatus)) return false;
  return !!(b.phone && digitsOnly(b.phone));
}
function ddTodayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function ddDayAction(day) {
  const c = DD_CADENCE.find(c => c.day === day) || DD_CADENCE[0];
  return 'Day ' + c.day + ' — ' + c.action;
}
/* Day 2 → skip Day 3 → Day 4 lands 2 days out; otherwise next day */
function ddNextDay(day) { return day === 1 ? 2 : day === 2 ? 4 : 1; }
function ddNextDue(day) {
  const d = new Date();
  d.setDate(d.getDate() + (day === 2 ? 2 : 1));
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function ddDueLabel(b) {
  const t = ddTodayStr();
  if (!b.dialNextDate || b.dialNextDate === t) return 'Due today';
  if (b.dialNextDate < t) return 'Overdue — was due ' + fmtDate(b.dialNextDate);
  return 'Due ' + fmtDate(b.dialNextDate);
}
async function ddBuildQueue() {
  let pool = buyers.filter(ddCallable);
  if (ddDealFilter !== 'all') {
    try {
      const snap = await db.collection('dispoBuyerSearchResults').where('dealId', '==', ddDealFilter).get();
      const ids = new Set(snap.docs.map(d => (d.data() || {}).buyerId).filter(Boolean));
      pool = pool.filter(b => ids.has(b.id));
    } catch (e) { console.error('dialer deal filter failed', e); }
  }
  /* Due/overdue/never-called first, future-dated last */
  pool.sort((a, b) => String(a.dialNextDate || '').localeCompare(String(b.dialNextDate || '')));
  ddQueue = pool;
  ddIdx = 0;
}
function ddCurrent() { return ddIdx < ddQueue.length ? ddQueue[ddIdx] : null; }

function renderDialer() {
  const pill = $('dialer-pill');
  if (pill && ddBooted) pill.textContent = buyers.filter(ddCallable).length;
  if (!ddBooted) {
    $('content').innerHTML = '<div class="empty-state">Loading…</div>';
    setTimeout(() => { if (tab === 'dialer' && !ddStarted) renderDialer(); }, 1500);
    return;
  }
  if (!ddStats) ddResetStats();
  if (!ddStarted) { renderDialerStart(); return; }
  renderDialerMain();
}
function renderDialerStart() {
  const callable = buyers.filter(ddCallable);
  const paused = buyers.filter(b => b.dialStatus === 'paused' && b.status !== 'inactive');
  const dealOpts = ['<option value="all">🤝 All buyers</option>'].concat(
    deals.map(d => `<option value="${d.id}"${ddDealFilter === d.id ? ' selected' : ''}>📦 ${esc(d.address || 'Untitled deal')}</option>`)
  ).join('');
  $('content').innerHTML = `<div class="dd-wrap">
    <div class="detail-card">
      <h2>📞 Buyer Dialer</h2>
      <div class="addr-sub">${callable.length} callable buyer${callable.length === 1 ? '' : 's'} · 4-day cycle</div>
      <div class="section-label">Call list</div>
      <div class="dd-filter"><select id="dd-deal-filter" onchange="ddChangeFilter(this)">${dealOpts}</select></div>
      <button class="btn-gold" style="width:100%;min-height:52px;font-size:17px;" onclick="ddStart()">▶ Start calling</button>
      <button class="btn-ghost" style="width:100%;margin-top:10px;" onclick="ddToggleCadence()">${ddShowCadence ? '▴ Hide' : '▾ Show'} call cadence</button>
      ${ddShowCadence ? `<div class="dd-cadence" style="margin-top:12px;">
        <b>Day 1</b> — Double Dial + VM + SMS<br>
        <b>Day 2</b> — Double Dial + VM + SMS<br>
        <b>Day 3</b> — Rest day (skip)<br>
        <b>Day 4</b> — Double Dial + VM + SMS (send deal)<br>
        <span style="color:#5c6b82;">No Answer advances to the next call day. Interested removes the buyer from the queue; Not Active pauses them; Bad Number / DNC remove them permanently.</span>
      </div>` : ''}
      ${ddStats && ddStats.called ? `<div class="dd-stats" style="margin-top:12px;">Session: 📞 ${ddStats.called} called · ✅ ${ddStats.interested} interested · 📵 ${ddStats.no_answer} no answer · ⏸️ ${ddStats.not_active} not active · ❌ ${ddStats.bad_number} bad # · 🚫 ${ddStats.dnc} DNC</div>` : ''}
    </div>
    ${paused.length ? `<div class="detail-card">
      <h2 style="font-size:18px;">⏸️ Paused (Not Active) <span style="color:#8a97a8;font-size:13px;font-weight:400;">(${paused.length})</span></h2>
      ${paused.map(b => `<div class="dd-paused-row"><span>${esc(ddBuyerName(b))}</span><button class="btn-ghost" onclick="ddResumeBuyer('${b.id}')">Resume</button></div>`).join('')}
    </div>` : ''}
  </div>`;
}
function ddChangeFilter(sel) { ddDealFilter = sel.value; renderDialerStart(); }
function ddToggleCadence() { ddShowCadence = !ddShowCadence; renderDialerStart(); }
async function ddStart() {
  ddResetStats();
  showToast('Building call queue…');
  await ddBuildQueue();
  ddStarted = true;
  window.scrollTo(0, 0);
  renderDialerMain();
}
function ddExit() { ddStarted = false; ddQueue = []; ddIdx = 0; renderDialerStart(); }
function ddPrev() { if (ddIdx > 0) { ddIdx--; renderDialerMain(); } }
function ddNext() {
  if (ddIdx < ddQueue.length - 1) { ddIdx++; renderDialerMain(); }
  else showToast('End of queue');
}
function renderDialerMain() {
  const b = ddCurrent();
  const total = ddQueue.length;
  const dealName = ddDealFilter === 'all' ? '🤝 All buyers'
    : '📦 ' + (((deals.find(d => d.id === ddDealFilter) || {}).address) || 'Deal');
  let html = `<div class="dd-wrap">
    <div class="dd-top">
      <button class="btn-ghost" onclick="ddExit()">✕ Exit</button>
      <div class="dd-progress">${esc(dealName)} · ${b ? (ddIdx + 1) + ' of ' + total : total + ' called'}</div>
      <div style="width:70px;"></div>
    </div>
    <div class="dd-stats">📞 ${ddStats.called} called · ✅ ${ddStats.interested} interested · 📵 ${ddStats.no_answer} no answer · ⏸️ ${ddStats.not_active} not active · ❌ ${ddStats.bad_number} bad # · 🚫 ${ddStats.dnc} DNC</div>`;
  if (!b) {
    html += `<div class="dd-card dd-done">
      <div style="font-size:48px;">🎉</div>
      <h2 style="color:#e9edf3;">Queue complete!</h2>
      <p style="color:#8a97a8;">Called ${ddStats.called} · ${ddStats.interested} interested</p>
      <button class="btn-gold" onclick="ddExit()" style="margin:16px auto 0;">Back to dialer start</button>
    </div></div>`;
    $('content').innerHTML = html;
    return;
  }
  const day = b.dialDay || 1;
  const digits = digitsOnly(b.phone);
  html += `
    <div class="dd-card">
      <div class="dd-day">📅 ${esc(ddDayAction(day))}</div>
      <div class="dd-name">${esc(ddBuyerName(b))}</div>
      <div class="dd-entity">${esc(b.type || '')}${b.type ? ' · ' : ''}${esc(ddDueLabel(b))}</div>
      ${b.boughtPropertyAddress ? `<div class="dd-row">🏠 <b>${esc(b.boughtPropertyAddress)}</b>${b.boughtPropertyPrice ? ' · ' + esc(b.boughtPropertyPrice) : ''}</div>` : ''}
      ${b.buyBox ? `<div class="dd-row">🎯 <i>${esc(b.buyBox)}</i></div>` : ''}
      ${b.lastDialDispo ? `<div class="dd-last">Last: ${esc(ddOutcomeLabel(b.lastDialDispo))}${b.lastDialAt ? ' · ' + esc(fmtDate(b.lastDialAt)) : ''}</div>` : ''}
      <a class="dd-call" href="tel:${digits}">📞 ${esc(formatPhone(b.phone))}</a>
    </div>
    <div class="dd-nav-row">
      <button class="dd-nav-btn" onclick="ddPrev()">‹ Prev</button>
      <button class="dd-nav-btn" onclick="ddNext()">Next ›</button>
    </div>
    <div class="dd-notes">
      <div class="section-label" style="margin-bottom:8px;">Notes</div>
      <textarea id="dd-note" rows="3" placeholder="Call notes…"></textarea>
    </div>
    <div class="dd-outcomes">
      <div class="section-label" style="margin-bottom:8px;">Call Disposition</div>
      <div class="dd-outcome-grid">
        ${DD_OUTCOMES.map(o => `<button class="dd-outcome" onclick="ddApplyOutcome('${o.id}')">${o.label}</button>`).join('')}
      </div>
    </div>
  </div>`;
  $('content').innerHTML = html;
  window.scrollTo(0, 0);
}
async function ddApplyOutcome(outcomeId) {
  if (ddBusy) return;
  const b = ddCurrent();
  if (!b || !ddStats) return;
  const oc = DD_OUTCOMES.find(o => o.id === outcomeId);
  const label = oc ? oc.label : outcomeId;
  if ((outcomeId === 'dnc' || outcomeId === 'bad_number') &&
      !confirm(`"${label}" removes ${ddBuyerName(b)} from all future dialer queues. Continue?`)) return;
  ddBusy = true;
  const noteEl = $('dd-note');
  const note = noteEl ? noteEl.value.trim() : '';
  const at = new Date().toISOString();
  try {
    await db.collection('dispoBuyerCalls').add({
      buyerId: b.id,
      dealId: ddDealFilter !== 'all' ? ddDealFilter : null,
      disposition: outcomeId,
      notes: note,
      at
    });
    const upd = { lastDialDispo: outcomeId, lastDialAt: at, updatedAt: at };
    const day = b.dialDay || 1;
    if (outcomeId === 'no_answer') { upd.dialDay = ddNextDay(day); upd.dialNextDate = ddNextDue(day); }
    else if (outcomeId === 'interested') upd.dialStatus = 'interested';
    else if (outcomeId === 'not_active') upd.dialStatus = 'paused';
    else if (outcomeId === 'bad_number') upd.dialStatus = 'bad_number';
    else if (outcomeId === 'dnc') upd.dialStatus = 'dnc';
    await db.collection('dispoBuyers').doc(b.id).set(upd, { merge: true });
    Object.assign(b, upd);
  } catch (e) {
    console.error('dialer log failed', e);
    showToast('Log failed — check connection');
    ddBusy = false;
    return;
  }
  ddStats.called++;
  if (ddStats[outcomeId] !== undefined) ddStats[outcomeId]++;
  ddQueue.splice(ddIdx, 1);
  if (ddIdx >= ddQueue.length) ddIdx = Math.max(0, ddQueue.length - 1);
  ddBusy = false;
  showToast(`${label} logged`);
  renderDialerMain();
}
async function ddResumeBuyer(id) {
  try {
    await db.collection('dispoBuyers').doc(id).set(
      { dialStatus: null, dialDay: 1, dialNextDate: null, updatedAt: new Date().toISOString() },
      { merge: true }
    );
    const b = buyers.find(x => x.id === id);
    if (b) { b.dialStatus = null; b.dialDay = 1; b.dialNextDate = null; }
    renderDialerStart();
    showToast('Buyer resumed');
  } catch (e) {
    console.error(e);
    showToast('Resume failed — check connection');
  }
}

</script>
