function smsPaceCountdown(ms) {
  return new Promise(resolve => {
    const end = Date.now() + ms;
    const iv = setInterval(() => {
      if (!smsRun || smsRun.cancel) { clearInterval(iv); resolve(); return; }
      const left = Math.max(0, end - Date.now());
      const el = document.getElementById('sb-countdown');
      if (el) el.textContent = 'Next text in ' + Math.floor(left / 60) + ':' + String(Math.floor(left % 60)).padStart(2, '0');
      if (left <= 0) { clearInterval(iv); resolve(); }
    }, 1000);
  });
}
async function startSmsBlast(dealId) {
  const d = deals.find(x => x.id === dealId); if (!d || smsRun) return;
  const group = (document.querySelector('input[name="sb-group"]:checked') || {}).value || 'all';
  const intervalSec = parseInt(($('sb-interval') || {}).value || '10', 10) || 10;
  let pulled = [];
  try { pulled = await dealPulledBuyers(dealId); } catch (e) { showToast('Could not load buyers'); return; }
  let recips = pulled.filter(r => r._buyer && r._buyer.phone && r._buyer.status !== 'inactive');
  if (group === 'top') recips = recips.filter(r => r.smartMatch === true);
  // Safety net: never re-text a buyer already texted for this deal (e.g. via a one-off text).
  const contactedNow = await contactedBuyerIds(dealId, 'dispoSmsBlasts');
  recips = recips.filter(r => !contactedNow.has(r._buyer.id));
  if (!recips.length) { showToast('No recipients in this group'); return; }
  const mins = Math.ceil(recips.length * intervalSec / 60);
  if (!confirm('Send ' + recips.length + ' texts, one every ' + intervalSec + ' seconds (~' + mins + ' min)?\n\nFrom ' + dealPhoneDispo(d) + '. Keep DispoHub open until it finishes.')) return;
  const sendBtn = document.getElementById('sb-send'); if (sendBtn) sendBtn.disabled = true;
  const prog = document.getElementById('sb-progress');
  const msgTpl = ($('sb-body') || {}).value || smsT(1);
  const fromId = quoFromNumberId(d);
  smsRun = { cancel: false, finished: false };
  let ok = 0, fail = 0; const logArr = []; const sentIds = [];
  const pushLog = line => { logArr.push(line); if (logArr.length > 60) logArr.shift(); };
  const renderProg = (done, note) => {
    if (!prog) return;
    prog.style.display = 'block';
    const pct = Math.round(done / recips.length * 100);
    prog.innerHTML = '<div class="detail-card"><div class="section-label" style="margin-top:0;">Sending… ' + done + ' of ' + recips.length + '</div>' +
      '<div style="height:10px;background:#0b1626;border-radius:6px;overflow:hidden;margin-bottom:10px;"><div style="height:100%;width:' + pct + '%;background:linear-gradient(90deg,#d4a843,#e8c476);"></div></div>' +
      '<div id="sb-countdown" style="font-size:13px;color:#8a97a8;margin-bottom:8px;">' + esc(note || '') + '</div>' +
      '<div id="sb-log" style="font-size:12px;color:#aeb9c7;max-height:180px;overflow-y:auto;background:#0b1626;border-radius:8px;padding:10px;">' + logArr.map(l => '<div>' + esc(l) + '</div>').join('') + '</div>' +
      '<button class="btn-ghost" style="width:100%;min-height:48px;margin-top:10px;" onclick="cancelSmsBlast()">⏹ Cancel Blast</button></div>';
    const lg = document.getElementById('sb-log'); if (lg) lg.scrollTop = lg.scrollHeight;
  };
  let blastRef = null;
  try { blastRef = await db.collection('dispoSmsBlasts').add({ type: 'blast', dealId, dealAddress: d.address, startedAt: new Date().toISOString(), total: recips.length, sent: 0, failed: 0, status: 'running', intervalSec, template: msgTpl }); } catch (e) { console.warn('sms blast log failed', e); }
  renderProg(0, 'Starting…');
  for (let i = 0; i < recips.length; i++) {
    if (!smsRun || smsRun.cancel) break;
    const b = recips[i]._buyer;
    const label = (i + 1) + '/' + recips.length + ' ' + formatPhone(b.phone);
    await ensureQuoContact(b, d);
    const msgFilled = fillSms(msgTpl, d, b);
    try {
      await sendSmsViaQuo(b.phone, msgFilled, fromId);
      ok++; sentIds.push(b.id); pushLog('✅ ' + label);
    } catch (e) { fail++; pushLog('❌ ' + label + ' — ' + e.message); }
    if (blastRef) blastRef.set({ sent: ok, failed: fail, buyerIds: sentIds }, { merge: true }).catch(() => {});
    renderProg(i + 1, i < recips.length - 1 ? '' : 'Finishing…');
    if (i < recips.length - 1 && smsRun && !smsRun.cancel) await smsPaceCountdown(intervalSec * 1000);
  }
  const cancelled = !smsRun || smsRun.cancel;
  if (blastRef) blastRef.set({ status: cancelled ? 'cancelled' : 'done', finishedAt: new Date().toISOString() }, { merge: true }).catch(() => {});
  smsRun = { cancel: false, finished: true };
  renderProg(recips.length, cancelled ? 'Cancelled.' : 'Done.');
  showToast(cancelled ? 'SMS blast cancelled' : 'SMS blast done: ' + ok + ' sent' + (fail ? ', ' + fail + ' failed' : ''));
}

/* ================= 📞 DispoHub Dialer =================
   Buyer call dialer — same single-column format as the CRM dialers
   (buyer card on top, Notes + disposition buttons below).
   Outreach cadence: Day 1 = SMS #1 bulk blast (prerequisite, sent via
   📱 Text Buyers — buyers can't enter the dialer for a deal until texted).
   Dialer call steps: D1 Double Dial+VM → manual SMS #2 → D2 Double Dial →
   manual SMS #3 → D4 Double Dial+VM → manual SMS #4 → restart.
   Calls log to `dispoBuyerCalls`; per-buyer cycle state lives on the
   buyer doc (dialDay, dialNextDate, dialStatus, lastDialDispo, lastDialAt,
   smsStepByDeal).
   dialStatus: 'paused' (Not Active — resumable), 'bad_number' / 'dnc' /
   'interested' (permanently out of the queue). */
const DD_OUTCOMES = [
  { id: 'no_answer', label: 'No Answer' },
  { id: 'interested', label: 'Interested' },
  { id: 'not_active', label: 'Not Active' },
  { id: 'bad_number', label: 'Bad Number' },
  { id: 'dnc', label: 'DNC' }
];
/* New outreach cadence: SMS #1 (bulk blast via 📱 Text Buyers) is a prerequisite
   handled outside the dialer — the dialer only runs the call steps.
   Manual SMS #2/#3/#4 are fired from the "Send SMS" prompt after each No Answer. */
const DD_CADENCE = [
  { day: 1, action: 'Double Dial + VM → SMS #2' },
  { day: 2, action: 'Double Dial → SMS #3' },
  { day: 4, action: 'Double Dial + VM → SMS #4' }
];
let ddBooted = false;
let ddQueue = [];
let ddIdx = 0;
let ddDealFilter = 'all';
let ddStarted = false;
let ddShowCadence = false;
let ddBusy = false;
let ddStats = null;
/* SMS #1 gate: buyers pulled for the selected deal but not yet texted for it.
   Computed per deal; the dialer queue excludes them until the bulk blast goes out. */
let ddAwaitingSms = [];
let ddAwaitingFor = null;
function ddResetStats() { ddStats = { called: 0, no_answer: 0, interested: 0, not_active: 0, bad_number: 0, dnc: 0 }; }
function ddBuyerName(b) {
  const fl = [b.firstName, b.lastName].filter(Boolean).join(' ').trim();
  return fl || b.name || 'Unknown buyer';
}
function ddOutcomeLabel(id) {
  const o = DD_OUTCOMES.find(o => o.id === id);
  return o ? o.label : (id || '—');
}
/* Callable = has a phone, not inactive, not DNC/bad-number/interested/paused */
function ddCallable(b) {
  if (!b || b.status === 'inactive') return false;
  if (['dnc', 'bad_number', 'interested', 'paused'].includes(b.dialStatus)) return false;
  return !!(b.phone && digitsOnly(b.phone));
}
function ddTodayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function ddDayAction(day) {
  const c = DD_CADENCE.find(c => c.day === day) || DD_CADENCE[0];
  return 'Day ' + c.day + ' — ' + c.action;
}
/* Day 1 → Day 2 (tomorrow), Day 2 → Day 4 (2 days out), Day 4 → Day 1 (restart) */
function ddNextDay(day) { return day === 1 ? 2 : day === 2 ? 4 : 1; }
function ddNextDue(day) {
  const d = new Date();
  d.setDate(d.getDate() + (day === 2 ? 2 : 1));
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function ddDueLabel(b) {
  const t = ddTodayStr();
  if (!b.dialNextDate || b.dialNextDate === t) return 'Due today';
  if (b.dialNextDate < t) return 'Overdue — was due ' + fmtDate(b.dialNextDate);
  return 'Due ' + fmtDate(b.dialNextDate);
}
async function ddBuildQueue() {
  let pool = buyers.filter(ddCallable);
  if (ddDealFilter !== 'all') {
    try {
      const snap = await db.collection('dispoBuyerSearchResults').where('dealId', '==', ddDealFilter).get();
      const ids = new Set(snap.docs.map(d => (d.data() || {}).buyerId).filter(Boolean));
      pool = pool.filter(b => ids.has(b.id));
    } catch (e) { console.error('dialer deal filter failed', e); }
  }
  /* Due/overdue/never-called first, future-dated last */
  pool.sort((a, b) => String(a.dialNextDate || '').localeCompare(String(b.dialNextDate || '')));
  ddQueue = pool;
  ddIdx = 0;
}
/* SMS #1 gate (per deal): a buyer can't enter the call dialer for a deal until
   SMS #1 (the bulk blast) has been sent to them for that deal.
   Fail-open: if the SMS check can't run, don't block calling. */
async function ddApplySmsGate() {
  ddAwaitingSms = [];
  if (ddDealFilter === 'all') return;
  try {
    const contacted = await contactedBuyerIds(ddDealFilter, 'dispoSmsBlasts');
    ddAwaitingSms = ddQueue.filter(b => !contacted.has(b.id));
    ddQueue = ddQueue.filter(b => contacted.has(b.id));
    ddAwaitingFor = ddDealFilter;
  } catch (e) { console.error('dialer SMS #1 gate failed', e); }
}
function ddCurrent() { return ddIdx < ddQueue.length ? ddQueue[ddIdx] : null; }

function renderDialer() {
  if (!ddBooted) {
    sectionContentEl().innerHTML = '<div class="empty-state">Loading…</div>';
    setTimeout(() => { if (modalSection === 'dialer' && !ddStarted) renderDialer(); }, 1500);
    return;
  }
  if (!ddStats) ddResetStats();
  if (!ddStarted) { renderDialerStart(); return; }
  renderDialerMain();
}
function renderDialerStart() {
  const callable = buyers.filter(ddCallable);
  const paused = buyers.filter(b => b.dialStatus === 'paused' && b.status !== 'inactive');
  if (ddDealFilter !== 'all' && ddAwaitingFor !== ddDealFilter && !ddStarted) ddLoadAwaiting();
  const dealOpts = ['<option value="all">🤝 All buyers</option>'].concat(
    deals.map(d => `<option value="${d.id}"${ddDealFilter === d.id ? ' selected' : ''}>📦 ${esc(d.address || 'Untitled deal')}</option>`)
  ).join('');
  sectionContentEl().innerHTML = `<div class="dd-wrap">
    <div class="detail-card">
      <h2>📞 Buyer Dialer</h2>
      <div class="addr-sub">${callable.length} callable buyer${callable.length === 1 ? '' : 's'} · SMS #1 → Day 1 → Day 2 → Day 4</div>
      <div class="section-label">Call list</div>
      <div class="dd-filter"><select id="dd-deal-filter" onchange="ddChangeFilter(this)">${dealOpts}</select></div>
      <button class="btn-gold" style="width:100%;min-height:52px;font-size:17px;" onclick="ddStart()">▶ Start calling</button>
      <button class="btn-ghost" style="width:100%;margin-top:10px;" onclick="ddToggleCadence()">${ddShowCadence ? '▴ Hide' : '▾ Show'} call cadence</button>
      ${ddShowCadence ? `<div class="dd-cadence" style="margin-top:12px;">
        <b>Day 1 — SMS #1</b> — bulk blast via 📱 Text Buyers (prerequisite)<br>
        <b>Day 1</b> — Double Dial + VM → manual 📱 SMS #2<br>
        <b>Day 2</b> — Double Dial → manual 📱 SMS #3<br>
        <b>Day 4</b> — Double Dial + VM → manual 📱 SMS #4<br>
        <span style="color:#5c6b82;">Buyers can't enter the dialer for a deal until SMS #1 (the bulk blast) has been sent to them for that deal — they wait under ⏳ Awaiting SMS #1 below. After a No Answer, the 📱 Send SMS button fires the manual follow-up text. Interested removes the buyer from the queue; Not Active pauses them; Bad Number / DNC remove them permanently.</span>
      </div>` : ''}
      ${ddStats && ddStats.called ? `<div class="dd-stats" style="margin-top:12px;">Session: 📞 ${ddStats.called} called · ✅ ${ddStats.interested} interested · 📵 ${ddStats.no_answer} no answer · ⏸️ ${ddStats.not_active} not active · ❌ ${ddStats.bad_number} bad # · 🚫 ${ddStats.dnc} DNC</div>` : ''}
    </div>
    ${ddDealFilter !== 'all' && ddAwaitingSms.length ? `<div class="detail-card">
      <h2 style="font-size:18px;">⏳ Awaiting SMS #1 <span style="color:#8a97a8;font-size:13px;font-weight:400;">(${ddAwaitingSms.length})</span></h2>
      <div class="addr-sub">These buyers haven't received the SMS #1 bulk blast for this deal yet — run 📱 Text Buyers from the deal page first, then they'll unlock for calling.</div>
      ${ddAwaitingSms.slice(0, 25).map(b => `<div class="dd-paused-row"><span>${esc(ddBuyerName(b))}</span><span style="color:#8a97a8;font-size:12px;">${esc(formatPhone(b.phone))}</span></div>`).join('')}
      ${ddAwaitingSms.length > 25 ? `<div class="addr-sub">+${ddAwaitingSms.length - 25} more…</div>` : ''}
    </div>` : ''}
    ${paused.length ? `<div class="detail-card">
      <h2 style="font-size:18px;">⏸️ Paused (Not Active) <span style="color:#8a97a8;font-size:13px;font-weight:400;">(${paused.length})</span></h2>
      ${paused.map(b => `<div class="dd-paused-row"><span>${esc(ddBuyerName(b))}</span><button class="btn-ghost" onclick="ddResumeBuyer('${b.id}')">Resume</button></div>`).join('')}
    </div>` : ''}
  </div>`;
}
function ddChangeFilter(sel) { ddDealFilter = sel.value; ddAwaitingSms = []; ddAwaitingFor = null; renderDialerStart(); }
/* Compute the ⏳ Awaiting SMS #1 list for the dialer start screen (per selected deal). */
async function ddLoadAwaiting() {
  const dealId = ddDealFilter;
  if (dealId === 'all' || ddStarted) return;
  try {
    const snap = await db.collection('dispoBuyerSearchResults').where('dealId', '==', dealId).get();
    const ids = new Set(snap.docs.map(d => (d.data() || {}).buyerId).filter(Boolean));
    const contacted = await contactedBuyerIds(dealId, 'dispoSmsBlasts');
    ddAwaitingSms = buyers.filter(b => ddCallable(b) && ids.has(b.id) && !contacted.has(b.id));
  } catch (e) { console.error('dialer awaiting SMS failed', e); ddAwaitingSms = []; }
  ddAwaitingFor = dealId;
  if (!ddStarted && ddDealFilter === dealId && modalSection === 'dialer') renderDialerStart();
}
function ddToggleCadence() { ddShowCadence = !ddShowCadence; renderDialerStart(); }
async function ddStart() {
  ddResetStats();
  showToast('Building call queue…');
  await ddBuildQueue();
  await ddApplySmsGate();
  ddStarted = true;
  modalScrollTop();
  renderDialerMain();
}
function ddExit() { ddStarted = false; ddQueue = []; ddIdx = 0; renderDialerStart(); }
function ddPrev() { if (ddIdx > 0) { ddIdx--; renderDialerMain(); } }
function ddNext() {
  if (ddIdx < ddQueue.length - 1) { ddIdx++; renderDialerMain(); }
  else showToast('End of queue');
}
function renderDialerMain() {
  const b = ddCurrent();
  const total = ddQueue.length;

  let html = `<div class="dd-wrap">
    <div class="dd-top">
      <button class="btn-ghost" onclick="ddExit()">✕ Exit</button>

      <div style="width:70px;"></div>

    </div></div>`;

      ${b.boughtPropertyAddress ? `<div class="dd-row">🏠 <b>${esc(b.boughtPropertyAddress)}</b>${b.boughtPropertyPrice ? ' · ' + esc(b.boughtPropertyPrice) : ''}</div>` : ''}
      ${b.buyBox ? `<div class="dd-row">🎯 <i>${esc(b.buyBox)}</i></div>` : ''}
      ${b.lastDialDispo ? `<div class="dd-last">Last: ${esc(ddOutcomeLabel(b.lastDialDispo))}${b.lastDialAt ? ' · ' + esc(fmtDate(b.lastDialAt)) : ''}</div>` : ''}
      <a class="dd-call" href="tel:${digits}" onclick="logDispoDialClick('${b.id}',ddDealFilter)">📞 ${esc(formatPhone(b.phone))}</a>

async function ddApplyOutcome(outcomeId) {
  if (ddBusy) return;
  const b = ddCurrent();
  if (!b || !ddStats) return;
  const oc = DD_OUTCOMES.find(o => o.id === outcomeId);
  const label = oc ? oc.label : outcomeId;
  if ((outcomeId === 'dnc' || outcomeId === 'bad_number') &&
      !confirm(`"${label}" removes ${ddBuyerName(b)} from all future dialer queues. Continue?`)) return;
  ddBusy = true;
  const noteEl = $('dd-note');
  const note = noteEl ? noteEl.value.trim() : '';
  const at = new Date().toISOString();
  try {
    await db.collection('dispoBuyerCalls').add({
      buyerId: b.id,
      dealId: ddDealFilter !== 'all' ? ddDealFilter : null,
      disposition: outcomeId,
      notes: note,
      at
    });
    const upd = { lastDialDispo: outcomeId, lastDialAt: at, updatedAt: at };
    const day = b.dialDay || 1;
    if (outcomeId === 'no_answer') { upd.dialDay = ddNextDay(day); upd.dialNextDate = ddNextDue(day); }
    else if (outcomeId === 'interested') upd.dialStatus = 'interested';
    else if (outcomeId === 'not_active') upd.dialStatus = 'paused';
    else if (outcomeId === 'bad_number') upd.dialStatus = 'bad_number';
    else if (outcomeId === 'dnc') upd.dialStatus = 'dnc';
    await db.collection('dispoBuyers').doc(b.id).set(upd, { merge: true });
    Object.assign(b, upd);
  } catch (e) {
    console.error('dialer log failed', e);
    showToast('Log failed — check connection');
    ddBusy = false;
    return;
  }
  ddStats.called++;
  if (ddStats[outcomeId] !== undefined) ddStats[outcomeId]++;
  ddQueue.splice(ddIdx, 1);
  if (ddIdx >= ddQueue.length) ddIdx = Math.max(0, ddQueue.length - 1);
  ddBusy = false;
  showToast(`${label} logged`);
  if (outcomeId === 'no_answer') { renderDialerSmsPrompt(b, day); return; }
  renderDialerMain();
}
/* After a No Answer: prompt the manual follow-up text.
   SMS #2 follows Day-1 calls, #3 follows Day-2, #4 follows Day-4. */
function renderDialerSmsPrompt(b, dayJustCompleted) {
  const smsNum = Math.min((dayJustCompleted || 1) + 1, 4);
  const dealName = ddDealFilter === 'all' ? 'this deal'
    : '📦 ' + (((deals.find(d => d.id === ddDealFilter) || {}).address) || 'this deal');
  sectionContentEl().innerHTML = `<div class="dd-wrap">
    <div class="dd-top">
      <button class="btn-ghost" onclick="ddExit()">✕ Exit</button>
      <div class="dd-progress">${esc(dealName)} · ${ddQueue.length ? (ddIdx + 1) + ' of ' + ddQueue.length : 'done'}</div>
      <div style="width:70px;"></div>
    </div>
    <div class="dd-card" style="text-align:center;">
      <div style="font-size:44px;">📵</div>
      <h2 style="color:#e9edf3;margin:8px 0 4px;">No Answer logged</h2>
      <div style="color:#8a97a8;font-size:14px;margin-bottom:6px;">${esc(ddBuyerName(b))} · next: ${esc(ddDayAction(ddNextDay(dayJustCompleted)))}</div>
      <div class="addr-sub">Fire the manual follow-up text now, or skip to the next buyer.</div>
    </div>
    <button class="btn-gold" style="width:100%;min-height:56px;font-size:17px;margin-top:4px;" onclick="ddSendFollowupSms('${b.id}', ${smsNum})">📱 Send SMS #${smsNum}</button>
    <button class="btn-ghost" style="width:100%;margin-top:10px;min-height:52px;" onclick="renderDialerMain()">Next buyer →</button>
  </div>`;
  modalScrollTop();
}
function ddSendFollowupSms(buyerId, smsNum) {
  openSingleSms(buyerId, {
    bodyOverride: smsT(smsNum),
    preselectDealId: ddDealFilter !== 'all' ? ddDealFilter : null,
    followup: { dealId: ddDealFilter !== 'all' ? ddDealFilter : null, smsNum, buyerId }
  });
}
async function ddResumeBuyer(id) {
  try {
    await db.collection('dispoBuyers').doc(id).set(
      { dialStatus: null, dialDay: 1, dialNextDate: null, updatedAt: new Date().toISOString() },
      { merge: true }
    );
    const b = buyers.find(x => x.id === id);
    if (b) { b.dialStatus = null; b.dialDay = 1; b.dialNextDate = null; }
    renderDialerStart();
    showToast('Buyer resumed');
  } catch (e) {
    console.error(e);
    showToast('Resume failed — check connection');
  }
}

</script>

<!-- Section modal for KPIs / Dialer / SMS Templates -->
<div id="section-modal-overlay" class="section-modal-overlay" onclick="if(event.target===this)closeSectionModal()">
  <div class="section-modal-card">
    <div class="section-modal-header">
      <button class="section-modal-close" onclick="closeSectionModal()" title="Close">✕</button>
    </div>
    <div class="section-modal-body" id="section-modal-body"></div>
  </div>
</div>
<!-- Soft popup modals for Offers and Views -->
<div id="popup-overlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);z-index:1000;align-items:center;justify-content:center;padding:20px;" onclick="if(event.target===this)closePopup()">
  <div id="popup-content" style="background:linear-gradient(180deg,#1e3a5f,#182c49);border:1px solid #2a4a73;border-radius:18px;max-width:560px;width:100%;max-height:80vh;overflow-y:auto;padding:24px;box-shadow:0 24px 64px rgba(0,0,0,0.4);"></div>
</div>
<script>
function closePopup() {
  document.getElementById('popup-overlay').style.display = 'none';
}
async function openOffersPopup(dealId) {
  const d = deals.find(x => x.id === dealId);
  if (!d) return;
  const overlay = document.getElementById('popup-overlay');
  const content = document.getElementById('popup-content');
  content.innerHTML = '<h2 style="font-size:20px;margin-bottom:16px;">💰 Offers</h2><div class="timeline-empty">Loading…</div>';
  overlay.style.display = 'flex';
  try {
    const snap = await db.collection('dispoOffers').where('dealId', '==', dealId).get();
    const offers = snap.docs.map(o => ({ id: o.id, ...o.data() })).sort((a, b) => (+b.amount || +b.offerAmount || 0) - (+a.amount || +a.offerAmount || 0));
    content.innerHTML = '<h2 style="font-size:20px;margin-bottom:16px;">💰 Offers <span style="color:#8a97a8;font-size:14px;">(' + offers.length + ')</span></h2>' +
      (offers.length ? offers.map(o => {
        const amt = o.amount || o.offerAmount || 0;
        return '<div class="match-row"><div class="match-info"><div class="n">' + money(amt) + ' <span style="font-weight:400;color:#8a97a8;">— ' + esc(o.buyerName || 'Unknown') + '</span></div>' +
          '<div class="w">' + esc(o.status || 'pending') + (o.notes ? ' · ' + esc(o.notes) : '') + '</div></div>' +
          '<button class="btn-ghost" style="padding:6px 10px;min-height:0;" onclick="event.stopPropagation();armConfirm(this,()=>deleteOffer(\'' + dealId + '\',\'' + o.id + '\'))">✕</button></div>';
      }).join('') : '<div class="timeline-empty">No offers yet.</div>') +
      '<button class="btn-gold" style="margin-top:12px;width:100%;" onclick="closePopup();showOfferForm(\'' + dealId + '\')">+ Log Offer</button>';
  } catch (e) {
    content.innerHTML = '<h2>💰 Offers</h2><div class="timeline-empty">Could not load.</div>';
  }
}
async function openViewsPopup(dealId) {
  const overlay = document.getElementById('popup-overlay');
  const content = document.getElementById('popup-content');
  content.innerHTML = '<h2 style="font-size:20px;margin-bottom:16px;">👁️ Page Views</h2><div class="timeline-empty">Loading…</div>';
  overlay.style.display = 'flex';
  try {
    const snap = await db.collection('dispoPageViews').where('dealId', '==', dealId).get();
    const views = snap.docs.map(v => ({ id: v.id, ...v.data() }));
    const pageViews = views.filter(v => v.type === 'view');
    const timeEvents = views.filter(v => v.type === 'time');
    const clicks = views.filter(v => v.type === 'click');
    const sessions = {};
    pageViews.forEach(v => {
      const s = v.sessionId || 'unknown';
      if (!sessions[s]) sessions[s] = { buyerId: v.buyerId, views: 0, time: 0, clicks: [] };
      sessions[s].views++;
      if (v.buyerId && !sessions[s].buyerId) sessions[s].buyerId = v.buyerId;
    });
    timeEvents.forEach(v => { const s = v.sessionId || 'unknown'; if (sessions[s]) sessions[s].time += (+v.seconds || 0); });
    clicks.forEach(v => { const s = v.sessionId || 'unknown'; if (sessions[s]) sessions[s].clicks.push(v.action); });
    const sessionList = Object.values(sessions).sort((a, b) => b.views - a.views);
    const totalTime = timeEvents.reduce((sum, v) => sum + (+v.seconds || 0), 0);
    const avgTime = pageViews.length ? Math.round(totalTime / pageViews.length) : 0;
    const buyerIds = [...new Set(sessionList.map(s => s.buyerId).filter(Boolean))];
    const buyerMap = {};
    for (const bid of buyerIds) {
      try { const bdoc = await db.collection('dispoBuyers').doc(bid).get(); if (bdoc.exists) buyerMap[bid] = bdoc.data().name || 'Unknown'; } catch (e) {}
    }
    content.innerHTML = '<h2 style="font-size:20px;margin-bottom:8px;">👁️ Page Views</h2>' +
      '<div style="color:#8a97a8;font-size:13px;margin-bottom:16px;">' + pageViews.length + ' views · ' + Object.keys(sessions).length + ' visitors · ~' + avgTime + 's avg</div>' +
      (sessionList.length ? sessionList.slice(0, 20).map(s => {
        const name = s.buyerId ? (buyerMap[s.buyerId] || 'Unknown buyer') : 'Anonymous';
        const timeStr = s.time > 60 ? Math.round(s.time / 60) + 'm' : s.time + 's';
        const actions = [...new Set(s.clicks)].join(', ') || 'browsed';
        const hot = s.time > 60 || s.views > 2 || s.clicks.includes('offer_submit_attempt') ? ' 🔥' : '';
        return '<div class="match-row"><div class="match-info"><div class="n">' + esc(name) + hot + '</div><div class="w">' + s.views + ' view' + (s.views > 1 ? 's' : '') + ' · ' + timeStr + ' · ' + esc(actions) + '</div></div></div>';
      }).join('') : '<div class="timeline-empty">No views yet. Share the deal link to start tracking.</div>');
  } catch (e) {
    content.innerHTML = '<h2>👁️ Page Views</h2><div class="timeline-empty">Could not load.</div>';
  }
}
</script>
</body>
</html>
