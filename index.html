<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a1423">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DispoHub">
<title>DispoHub — Deal Disposition CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: #0a1423; color: #e9edf3; font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh; overflow-x: hidden;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  /* ===== Header ===== */
  .header {
    border-bottom: 1px solid #16283f; padding: 20px 28px 0; position: sticky; top: 0;
    background: rgba(10,20,35,.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); z-index: 20;
    transition: transform .25s ease, opacity .25s ease;
  }
  .header::after {
    content: ''; display: block; height: 1px; margin: 14px -28px 0;
    background: linear-gradient(90deg, transparent, rgba(212,168,67,.4), transparent);
  }
  .header-inner, .content { max-width: 1120px; margin: 0 auto; }
  .header-inner { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand h1 { margin: 2px 0 0; font-family: 'Cinzel', serif; font-size: 27px; font-weight: 700; letter-spacing: .04em; color: #e9c874; background: linear-gradient(180deg, #f3dda0 0%, #d4a843 70%, #b98a2f 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .btn-gold {
    background: linear-gradient(180deg, #e3b95c, #c9992f); color: #0d1b2e; border: 1px solid rgba(255,255,255,.14);
    border-radius: 10px; padding: 10px 20px; font-weight: 700; font-size: 14px; cursor: pointer; font-family: inherit;
    box-shadow: 0 2px 10px rgba(212,168,67,.22), inset 0 1px 0 rgba(255,255,255,.25);
  }
  .btn-gold:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(212,168,67,.32); }
  .btn-ghost {
    background: rgba(255,255,255,.03); border: 1px solid #22385a; color: #c7d2e0; border-radius: 10px;
    padding: 10px 16px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .btn-ghost:hover { border-color: rgba(212,168,67,.5); color: #e8c476; }

  .content { padding: 18px 20px 80px; }

  /* ===== Tabs ===== */
  .tabs { display: flex; gap: 6px; margin: 4px 0 16px; border-bottom: 1px solid #16283f; }
  .tab-btn {
    background: none; border: none; color: #8a97a8; font-size: 15px; font-weight: 700; padding: 12px 20px;
    cursor: pointer; font-family: inherit; border-bottom: 2px solid transparent; margin-bottom: -1px;
    display: flex; align-items: center; gap: 8px;
  }
  .tab-btn.active { color: #e8c476; border-bottom-color: #d4a843; }
  .tab-btn .pill { background: rgba(212,168,67,.14); color: #e8c476; font-size: 12px; padding: 2px 10px; border-radius: 12px; font-weight: 700; }

  /* ===== Section modal (KPIs / Dialer / SMS Templates) ===== */
  .section-modal-overlay { position: fixed; inset: 0; background: rgba(4,10,20,.82); display: none; align-items: center; justify-content: center; z-index: 1500; padding: 20px; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  .section-modal-overlay.open { display: flex; }
  .section-modal-card { background: linear-gradient(180deg,#1e3a5f,#182c49); border: 1px solid #2a4a73; border-radius: 18px; width: 100%; max-width: 760px; max-height: 92vh; display: flex; flex-direction: column; box-shadow: 0 24px 64px rgba(0,0,0,.5); }
  .section-modal-header { display: flex; align-items: center; justify-content: flex-end; padding: 12px 16px 0; flex-shrink: 0; }
  .section-modal-close { background: none; border: none; color: #8a97a8; font-size: 20px; cursor: pointer; border-radius: 8px; padding: 6px 12px; font-family: inherit; }
  .section-modal-close:hover { color: #fff; background: rgba(255,255,255,.06); }
  .section-modal-body { padding: 4px 22px 24px; overflow-y: auto; }
  .header-icon-btn.active { border-color: #d4a843 !important; color: #e8c476 !important; }
  @media (max-width: 640px) {
    .section-modal-overlay { padding: 0; align-items: flex-end; }
    .section-modal-card { max-width: 100%; max-height: 94vh; border-radius: 18px 18px 0 0; }
  }

  /* ===== Stage filter row ===== */
  .stage-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .stage-btn {
    background: rgba(255,255,255,.025); border: 1px solid #22385a; color: #c7d2e0; border-radius: 10px;
    padding: 9px 15px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .stage-btn:hover { border-color: rgba(212,168,67,.5); color: #e8c476; }
  .stage-btn.active { border-color: rgba(212,168,67,.6); background: rgba(212,168,67,.09); color: #e8c476; }
  .stage-btn .count { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }

  /* ===== Deal cards ===== */
  .deal-card {
    background: linear-gradient(180deg, #1e3a5f, #1a3355); border: 1px solid #2a4a73; border-radius: 16px;
    overflow: hidden; margin-bottom: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.35); cursor: pointer;
    transition: transform .18s ease, border-color .18s ease;
  }
  .deal-card:hover { transform: translateY(-2px); border-color: rgba(212,168,67,.4); }
  .deal-row { padding: 14px 16px; }
  .deal-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .deal-addr { font-weight: 800; font-size: 17px; }
  .stage-badge { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; border: 1px solid; white-space: nowrap; }
  .deal-sub { font-size: 13px; color: #aeb9c7; margin-top: 5px; }
  .deal-numbers { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; }
  .deal-num .l { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: #8a97a8; }
  .deal-num .v { font-size: 16px; font-weight: 800; color: #e8c476; font-family: 'JetBrains Mono', monospace; }
  .deal-num .v.green { color: #4caf82; }
  .deal-meta { display: flex; gap: 12px; margin-top: 10px; font-size: 12px; color: #8a97a8; flex-wrap: wrap; }
  .urgent { color: #e07a77; font-weight: 700; }

  /* ===== Buyer cards ===== */
  .buyer-card {
    background: linear-gradient(180deg, #1e3a5f, #1a3355); border: 1px solid #2a4a73; border-radius: 16px;
    padding: 14px 16px; margin-bottom: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.35); cursor: pointer;
  }
  .buyer-card:hover { border-color: rgba(212,168,67,.4); }
  .buyer-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .buyer-name { font-weight: 800; font-size: 16px; }
  .buyer-type { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; background: rgba(143,192,228,.12); color: #8fc0e4; border: 1px solid rgba(143,192,228,.4); }
  .buyer-type.llc { background: rgba(212,168,67,.12); color: #e8c476; border-color: rgba(212,168,67,.4); }
  .buyer-contact { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .call-link { font-size: 15px; color: #e8c476; font-weight: 700; text-decoration: none; }
  .buyer-buybox { font-size: 13px; color: #aeb9c7; margin-top: 8px; font-style: italic; }
  .buyer-stats { display: flex; gap: 14px; margin-top: 8px; font-size: 12px; color: #8a97a8; flex-wrap: wrap; }
  .buyer-stats b { color: #e8c476; }
  .inactive-tag { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; background: rgba(217,83,79,.12); color: #e07a77; border: 1px solid rgba(217,83,79,.4); }

  /* ===== Detail view ===== */
  .detail-wrap { max-width: 720px; margin: 0 auto; }
  .back-btn { background: none; border: none; color: #8a97a8; font-size: 14px; cursor: pointer; margin-bottom: 12px; font-family: inherit; }
  .back-btn:hover { color: #e8c476; }
  .detail-card { background: linear-gradient(180deg, #1e3a5f, #182c49); border: 1px solid #2a4a73; border-radius: 18px; padding: 22px; margin-bottom: 14px; }
  .detail-card h2 { font-size: 22px; margin-bottom: 4px; }
  .detail-card .addr-sub { color: #aeb9c7; font-size: 14px; margin-bottom: 14px; }
  .num-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 14px 0; }
  .num-box { background: rgba(0,0,0,.25); border: 1px solid #22385a; border-radius: 12px; padding: 12px; }
  .num-box .l { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: #8a97a8; }
  .num-box .v { font-size: 19px; font-weight: 800; color: #e8c476; font-family: 'JetBrains Mono', monospace; margin-top: 4px; }
  .num-box .v.green { color: #4caf82; }
  .num-box .v.dbl-edit { cursor: pointer; }
  .num-box .v.dbl-edit:hover { outline: 1px dashed rgba(200,147,42,.5); outline-offset: 2px; border-radius: 4px; }
  .num-box input { width: 100%; background: transparent; border: none; color: #e8c476; font-family: 'JetBrains Mono', monospace; font-size: 19px; font-weight: 800; outline: none; }
  .section-label { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #d4a843; font-weight: 700; margin: 18px 0 10px; }
  .photo-section { margin-top: 4px; }
  .drive-link-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .drive-link-row input {
    flex: 1 1 220px; padding: 10px 12px; border-radius: 10px; border: 1px solid #22385a; background: #0b1626;
    color: #e9edf3; font-size: 14px;
  }
  .drive-open-btn {
    background: #d4a843; color: #0d1b2e; border: none; border-radius: 10px; padding: 10px 16px;
    font-size: 13px; font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    text-decoration: none; display: inline-block;
  }
  .drive-edit-btn {
    background: #142640; color: #9fb3cc; border: 1px solid #22385a; border-radius: 10px; padding: 10px 12px;
    font-size: 14px; cursor: pointer;
  }
  .drive-carousel { display: flex; gap: 8px; overflow-x: auto; margin-top: 12px; padding-bottom: 4px; }
  .drive-thumb-link { flex: 0 0 auto; }
  .drive-thumb { width: 76px; height: 76px; object-fit: cover; border-radius: 8px; border: 1px solid #3a5a85; display: block; }
  .drive-thumb-wrap { position: relative; flex: 0 0 auto; }
  .drive-thumb-wrap.is-master .drive-thumb { border: 2px solid #d4a843; }
  .master-btn { position: absolute; top: -6px; right: -6px; width: 26px; height: 26px; border-radius: 50%; border: none; background: rgba(10,20,35,0.85); color: #8a97a8; font-size: 14px; cursor: pointer; line-height: 1; padding: 0; }
  .master-btn:hover { color: #d4a843; transform: scale(1.15); }
  .master-badge { position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); background: #d4a843; color: #0a1423; font-size: 9px; font-weight: 800; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
  .drive-carousel-msg { font-size: 12px; color: #8a97a8; margin-top: 8px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .form-field label { display: block; font-size: 11px; color: #8a97a8; margin-bottom: 5px; font-weight: 600; }
  .form-field input, .form-field select, .form-field textarea {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #22385a;
    background: #0b1626; color: #e9edf3; font-size: 14px; font-family: inherit;
  }
  .form-field textarea { resize: vertical; min-height: 70px; }
  .form-field input:focus, .form-field select:focus, .form-field textarea:focus { border-color: #d4a843; outline: none; }

  /* Timeline */
  .timeline { display: flex; flex-direction: column; }
  .timeline-item { padding: 10px 0; border-bottom: 1px solid #1a2f4d; font-size: 14px; }
  .timeline-item:last-child { border-bottom: none; }
  .timeline-ts { color: #8a97a8; font-size: 12px; }
  .timeline-empty { color: #5c6b82; font-size: 13px; padding: 12px 0; font-style: italic; }

  /* Match list */
  .match-row { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid #22385a; border-radius: 12px; margin-bottom: 8px; background: rgba(0,0,0,.2); }
  .match-score { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 18px; color: #e8c476; min-width: 52px; text-align: center; }
  .match-info { flex: 1; min-width: 0; }
  .match-info .n { font-weight: 700; font-size: 14px; }
  .match-info .w { font-size: 12px; color: #8a97a8; margin-top: 2px; }
  .match-call { flex-shrink: 0; }

  .empty-state { text-align: center; color: #5c6b82; padding: 40px 20px; font-size: 14px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #16294a; border: 1px solid #d4a843; color: #e8c476; padding: 12px 22px; border-radius: 12px; font-weight: 700; z-index: 9999; display: none; }
  .btn-ghost.armed { border-color: #e07a77 !important; color: #fff !important; background: rgba(217,83,79,.25) !important; animation: armPulse 1s ease-in-out infinite; }
  @keyframes armPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(217,83,79,.4); } 50% { box-shadow: 0 0 0 6px rgba(217,83,79,0); } }
  /* Buyer search */
  #buyer-map { height: 380px; border-radius: 14px; border: 1px solid #2a4a73; z-index: 1; }
  .leaflet-container { background: #0b1626; font-family: 'Inter', sans-serif; }
  .search-card { cursor: pointer; }
  .search-card:hover { border-color: rgba(212,168,67,.4); }
  .status-badge { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; border: 1px solid; white-space: nowrap; }
  @media (max-width: 640px){ #buyer-map { height: 320px; } }  .toolbar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .search-wrap { position: relative; flex: 1 1 220px; }
  .search-wrap input { width: 100%; padding: 11px 12px 11px 38px; border-radius: 10px; border: 1px solid #22385a; background: #0b1626; color: #e9edf3; font-size: 14px; }
  .search-wrap span { position: absolute; left: 12px; top: 11px; }

  /* ===== Mobile ===== */
  @media (max-width: 640px) {
    body { padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
    .header { padding: 14px 14px 0; }
    .header.header-hidden { transform: translateY(-110%); opacity: 0; pointer-events: none; }
    .brand h1 { font-size: 19px; }
    .content { padding: 14px 12px calc(60px + env(safe-area-inset-bottom)); }
    .tabs { overflow-x: auto; }
    .tab-btn { padding: 12px 14px; font-size: 14px; flex: 0 0 auto; }
    .form-grid { grid-template-columns: 1fr; }
    .form-field input, .form-field select, .form-field textarea { font-size: 16px; padding: 13px 12px; }
    .btn-gold, .btn-ghost { min-height: 48px; }
    .deal-numbers { gap: 10px; }
    .call-link { min-height: 48px; display: inline-flex; align-items: center; font-size: 17px; }
    .num-grid { grid-template-columns: 1fr 1fr; }
  }
  /* ===== DispoHub Dialer (single-column: card top, notes + dispos below) ===== */
  .dd-wrap { max-width: 560px; margin: 0 auto; }
  .dd-top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .dd-progress { flex: 1; text-align: center; color: #8a97a8; font-size: 14px; font-weight: 700; }
  .dd-stats { text-align: center; color: #5c6b82; font-size: 12px; margin-bottom: 12px; line-height: 1.8; }
  .dd-card { background: linear-gradient(180deg, #142a47, #0f2140); border: 1px solid #1e3554; border-radius: 18px; padding: 24px 20px; margin-bottom: 16px; }
  .dd-day { display: inline-block; background: rgba(212,168,67,.14); color: #e8c476; font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 12px; margin-bottom: 12px; }
  .dd-name { font-size: 24px; font-weight: 800; color: #e9edf3; }
  .dd-entity { color: #8a97a8; font-size: 13px; margin: 4px 0 12px; }
  .dd-row { font-size: 14px; color: #aeb9c7; margin-bottom: 8px; line-height: 1.5; }
  .dd-row b { color: #e9edf3; }
  .dd-last { font-size: 12px; color: #8a97a8; margin-bottom: 4px; }
  .dd-call { display: flex; align-items: center; justify-content: center; gap: 10px; background: linear-gradient(180deg, #e3b95c, #c9992f); color: #0d1b2e; font-size: 22px; font-weight: 800; border-radius: 16px; padding: 18px; text-decoration: none; margin: 14px 0 4px; box-shadow: 0 4px 18px rgba(212,168,67,.28); }
  .dd-call:active { transform: scale(.98); }
  .dd-notes { margin-top: 12px; }
  .dd-notes textarea { width: 100%; background: rgba(18,37,64,.6); border: 1px solid #22385a; border-radius: 10px; padding: 12px; color: #e9edf3; font-family: inherit; font-size: 14px; resize: vertical; box-sizing: border-box; }
  .dd-outcomes { margin-top: 18px; }
  .dd-outcome-grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .dd-outcome { flex: 1 1 30%; min-width: 140px; background: rgba(255,255,255,.03); border: 1px solid #2f4d78; color: #e9edf3; border-radius: 12px; padding: 15px 10px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; min-height: 56px; }
  .dd-outcome:active { background: rgba(212,168,67,.15); border-color: #d4a843; }
  .dd-nav-row { display: flex; gap: 10px; margin: 0 0 14px; }
  .dd-nav-btn { flex: 1; min-height: 52px; border-radius: 12px; font-size: 16px; font-weight: 700; background: rgba(18,37,64,.85); border: 1px solid #2f4d78; color: #9aa7ba; cursor: pointer; font-family: inherit; }
  .dd-nav-btn:active { border-color: #d4a843; color: #e8c476; }
  .dd-done { text-align: center; padding: 48px 20px; }
  .dd-filter { display: flex; gap: 10px; margin-bottom: 14px; align-items: center; flex-wrap: wrap; }
  .dd-filter select { flex: 1; min-width: 180px; background: #0d1b2e; color: #e9edf3; border: 1px solid #2f4d78; border-radius: 10px; padding: 12px; font-size: 15px; font-family: inherit; }
  .dd-cadence { background: rgba(18,37,64,.6); border: 1px solid #1e3554; border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; font-size: 13px; color: #8a97a8; line-height: 1.9; }
  .dd-cadence b { color: #e8c476; }
  .dd-paused-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: rgba(18,37,64,.5); border: 1px solid #22385a; border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; font-size: 14px; color: #aeb9c7; }
</style>
</head>
<body>
<div class="header" id="site-header">
  <div class="header-inner">
    <div class="brand">
      <img src="https://raw.githubusercontent.com/lucarebuffi-rgr/signature-assets/main/rgr_logo.png" alt="RGR" style="height:42px;width:auto;flex-shrink:0;" />
      <h1>DispoHub</h1>
    </div>
    <div class="header-actions">
      <button class="btn-ghost icon-btn header-icon-btn" id="hdr-dialer" onclick="openSectionModal('dialer')" title="Dialer">📞</button>
      <button class="btn-ghost icon-btn header-icon-btn" id="hdr-kpis" onclick="openSectionModal('kpis')" title="KPIs">📊</button>
      <button class="btn-ghost icon-btn header-icon-btn" id="hdr-smstmpl" onclick="openSectionModal('smstmpl')" title="SMS Templates">💬</button>
    </div>
  </div>
  <div class="header-inner">
    <div class="tabs" style="border-bottom:none; margin: 10px 0 0;">
      <button class="tab-btn active" data-tab="find">🔍 Find Buyers</button>
      <button class="tab-btn" data-tab="buyers">🤝 All Buyers <span class="pill" id="buyers-pill">0</span></button>
      <button class="tab-btn" data-tab="deals">📦 Deal Board <span class="pill" id="deals-pill">0</span></button>
    </div>
  </div>
</div>

<div class="content" id="content"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   MARKET DUPLICATION GUIDE — To clone this Dispo CRM for a new market:
   1. Copy index.html to a new repo (or new branch).
   2. Update CONFIG below: SHEETS_API_KEY, BUYERS_SHEET_ID.
   3. Update firebaseConfig below: create a new Firebase project, paste its config.
   4. Firestore collections (dispoDeals, dispoBuyers, dispoOffers, dispoActivity)

/* ---------------- Gmail sending (DispoHub deal email blasts) ----------------
   Sends straight from luca.rebuffi@royalgroupsrealty.com via the Gmail API.
   First use pops a Google consent screen (gmail.send scope); the token lasts
   ~1 hour and auto re-prompts on 401. */
const gmailProvider = new firebase.auth.GoogleAuthProvider();
gmailProvider.addScope('https://www.googleapis.com/auth/gmail.send');
let gmailAccessToken = '';
async function ensureGmailAuth() {
  if (gmailAccessToken) return gmailAccessToken;
  const res = await firebase.auth().signInWithPopup(gmailProvider);
  gmailAccessToken = (res.credential && res.credential.accessToken) || '';
  if (!gmailAccessToken) throw new Error('Google sign-in did not return an access token.');
  return gmailAccessToken;
}
function rfc2047(s) {
  const bytes = new TextEncoder().encode(String(s));
  let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b));
  return '=?UTF-8?B?' + btoa(bin) + '?=';
}
function b64urlEncode(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function buildMime(to, subject, textBody, htmlBody, attachments) {
  const boundary = 'dispo' + Date.now();
  let raw = 'From: Luca Rebuffi <luca.rebuffi@royalgroupsrealty.com>\r\n';
  raw += 'To: ' + to + '\r\n';
  raw += 'Subject: ' + rfc2047(subject) + '\r\n';
  raw += 'MIME-Version: 1.0\r\n';
  raw += 'Content-Type: multipart/mixed; boundary="' + boundary + '"\r\n\r\n';
  raw += '--' + boundary + '\r\nContent-Type: multipart/alternative; boundary="alt-' + boundary + '"\r\n\r\n';
  raw += '--alt-' + boundary + '\r\nContent-Type: text/plain; charset="UTF-8"\r\nContent-Transfer-Encoding: 8bit\r\n\r\n' + textBody + '\r\n\r\n';
  raw += '--alt-' + boundary + '\r\nContent-Type: text/html; charset="UTF-8"\r\nContent-Transfer-Encoding: 8bit\r\n\r\n' + htmlBody + '\r\n\r\n';
  raw += '--alt-' + boundary + '--\r\n';
  (attachments || []).forEach(a => {
    raw += '--' + boundary + '\r\nContent-Type: ' + a.mime + '; name="' + a.filename + '"\r\nContent-Transfer-Encoding: base64\r\nContent-Disposition: attachment; filename="' + a.filename + '"\r\n\r\n';
    raw += a.b64.replace(/(.{76})/g, '$1\r\n') + '\r\n\r\n';
  });
  raw += '--' + boundary + '--';
  return raw;
}
async function gmailSendRaw(raw, retried) {
  const token = await ensureGmailAuth();
  const res = await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/send', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: JSON.stringify({ raw: b64urlEncode(raw) })
  });
  if (res.status === 401 && !retried) { gmailAccessToken = ''; return gmailSendRaw(raw, true); }
  if (!res.ok) { const t = await res.text().catch(() => ''); throw new Error('Gmail send failed (' + res.status + '): ' + t.slice(0, 180)); }
  return res.json();
}
async function sendDealEmail(to, subject, textBody, htmlBody, attachments) {
  return gmailSendRaw(buildMime(to, subject, textBody, htmlBody, attachments));
}

  if (n === '' || n == null || isNaN(+n)) return '—';
  return '$' + (+n).toLocaleString('en-US', { maximumFractionDigits: 0 });

// Sort-safe string for Firestore date fields: handles Timestamp objects, ISO strings, or missing values.
// (A bare .localeCompare on a Timestamp throws — that silently emptied the buyer sections once.)
function tsStr(v) {
  if (!v) return '';
  if (typeof v === 'string') return v;
  try { if (v.toDate) return v.toDate().toISOString(); } catch (e) {}
  if (v.seconds != null) return new Date(v.seconds * 1000).toISOString();
  return String(v);
}
function fmtDate(iso) {
  if (!iso) return '—';
  // Bare YYYY-MM-DD dates parse as UTC midnight → noon local avoids day-shift in US timezones
  const s = /^\d{4}-\d{2}-\d{2}$/.test(iso) ? iso + 'T12:00:00' : iso;
  const d = new Date(s);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}
function daysLeft(dateStr) {
  if (!dateStr) return null;
  const ms = new Date(dateStr) - Date.now();
  return Math.ceil(ms / 86400000);
}

/* Two-tap inline delete confirmation (automation + mobile friendly, no native dialogs) */
function armConfirm(btn, fn) {
  if (btn.dataset.armed) {
    delete btn.dataset.armed;
    btn.classList.remove('armed');
    btn.innerHTML = btn.dataset.orig || btn.innerHTML;
    fn();
  } else {
    btn.dataset.armed = '1';
    btn.dataset.orig = btn.innerHTML;
    btn.classList.add('armed');
    btn.innerHTML = '⚠️ Tap again to confirm';
    setTimeout(() => {
      if (btn.dataset.armed) {
        delete btn.dataset.armed;
        btn.classList.remove('armed');
        btn.innerHTML = btn.dataset.orig || btn.innerHTML;
      }
    }, 6000);
  }
}
function digitsOnly(p) { return String(p || '').replace(/\D/g, ''); }
function formatPhone(p) {
  const d = digitsOnly(p);
  if (d.length === 10) return `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
  if (d.length === 11 && d[0] === '1') return `(${d.slice(1,4)}) ${d.slice(4,7)}-${d.slice(7)}`;
  return p || '';
}

/* ================= Buyer Match Engine (SmartMatch-style) =================
   Scores each buyer against a deal. Sources are pluggable — the engine only
   cares about buyer.buyingZips[], buyer.buyingCounties[], buy box text,
   cashBuys12mo, and lastVerified. */
function buyerZips(b) {
  return String(b.buyingZip || '').split(/[,;\s]+/).map(z => z.trim()).filter(Boolean);
}
function buyerCounties(b) {
  return String(b.buyingCounty || '').split(/[,;/]+/).map(c => c.trim().toLowerCase()).filter(Boolean);
}
function matchScore(deal, buyer) {
  if (buyer.status === 'inactive') return { score: 0, why: [] };
  let score = 0;
  const why = [];
  const dz = String(deal.zip || '').trim();
  const dc = String(deal.county || '').trim().toLowerCase();
  // Geographic overlap is required — a buyer with no ZIP/county/city match
  // never qualifies, no matter their track record (Luca, 2026-10-16).
  let geo = false;
  // ZIP match — strongest signal
  if (dz && buyerZips(buyer).includes(dz)) { score += 40; why.push('Same ZIP'); geo = true; }
  // County match
  if (dc && buyerCounties(buyer).includes(dc)) { score += 25; why.push('Same county'); geo = true; }
  // City match
  const dCity = String(deal.city || '').trim().toLowerCase();
  if (dCity && String(buyer.buyingCity || '').toLowerCase().includes(dCity)) { score += 15; why.push('Same city'); geo = true; }
  if (!geo) return { score: 0, why: [] };
  // Buy box keyword overlap (property type / deal flavor)
  const box = String(buyer.buyBox || '').toLowerCase();
  const dealText = `${deal.propertyType || ''} ${deal.notes || ''}`.toLowerCase();
  const keywords = ['rental', 'flip', 'duplex', 'multi', 'land', 'rural', 'residential', 'commercial', 'fixer', 'turnkey'];
  const hits = keywords.filter(k => box.includes(k) && dealText.includes(k));
  if (hits.length) { score += Math.min(10, hits.length * 5); why.push('Buy box: ' + hits.slice(0, 2).join(', ')); }
  // Track record — cash buys in last 12 months
  const cb = +buyer.cashBuys12mo || 0;
  if (cb >= 3) { score += 10; why.push(cb + ' cash buys/12mo'); }
  else if (cb >= 1) { score += 6; why.push(cb + ' cash buy(s)/12mo'); }
  // Recency of verification
  if (buyer.lastVerified) {
    const ageDays = (Date.now() - new Date(buyer.lastVerified)) / 86400000;
    if (ageDays < 90) { score += 5; why.push('Recently verified'); }
  }
  return { score: Math.min(100, score), why };
}
function rankedBuyers(deal) {
  return buyers
    .map(b => ({ buyer: b, ...matchScore(deal, b) }))
    .filter(r => r.score > 0)
    .sort((a, b) => b.score - a.score);
}

/* ================= Sheet import ================= */
async function importBuyers() {
  showToast('Importing buyers from sheet…');
  try {
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.BUYERS_SHEET_ID}/values/${encodeURIComponent(CONFIG.BUYERS_TAB)}!A1:O500?key=${CONFIG.SHEETS_API_KEY}`;
    const res = await fetch(url);
    const data = await res.json();
    const rows = data.values || [];
    if (rows.length < 2) { showToast('No buyer rows found in sheet'); return; }
    const H = rows[0].map(h => h.trim().toLowerCase());
    const col = name => H.indexOf(name.toLowerCase());
    const cName = col('buyer name'), cType = col('type'), cPhone = col('phone'), cEmail = col('email'),
          cMail = col('mailing address'), cCity = col('buying city'), cCounty = col('buying county'),
          cZip = col('buying zip'), cBox = col('buy box'), cSrc = col('source'), cSrcD = col('source detail'),
          cCash = col('cash buys (12 mo)'), cAdded = col('date added'), cVer = col('last verified'), cNotes = col('notes');
    let added = 0, updated = 0;
    const existing = {};
    buyers.forEach(b => { existing[String(b.name || '').toLowerCase()] = b; });
    for (let i = 1; i < rows.length; i++) {
      const r = rows[i];
      const name = (r[cName] || '').trim();
      if (!name) continue;
      const rec = {
        name,
        type: (r[cType] || '').trim(),
        phone: (r[cPhone] || '').trim(),
        email: (r[cEmail] || '').trim(),
        mailingAddress: (r[cMail] || '').trim(),
        buyingCity: (r[cCity] || '').trim(),
        buyingCounty: (r[cCounty] || '').trim(),
        buyingZip: (r[cZip] || '').trim(),
        buyBox: (r[cBox] || '').trim(),
        source: (r[cSrc] || '').trim(),
        sourceDetail: (r[cSrcD] || '').trim(),
        cashBuys12mo: (r[cCash] || '').trim(),
        dateAdded: (r[cAdded] || '').trim(),
        lastVerified: (r[cVer] || '').trim(),
        notes: (r[cNotes] || '').trim(),
        status: /inactive|not buying/i.test(r[cNotes] || '') ? 'inactive' : 'active',
        updatedAt: new Date().toISOString()
      };
      const ex = existing[name.toLowerCase()];
      if (ex) { await db.collection('dispoBuyers').doc(ex.id).set({ ...ex, ...rec }, { merge: true }); updated++; }
      else { await db.collection('dispoBuyers').add(rec); added++; }
    }
    await loadAll();
    renderBuyers();
    showToast(`Import done: ${added} added, ${updated} updated`);
  } catch (e) {
    console.error(e);
    showToast('Import failed — check connection');
  }
}

function modalScrollTop() {
  if (modalSection) document.getElementById('section-modal-body').scrollTop = 0;
  else window.scrollTo(0, 0);
}
function openSectionModal(section) {
  modalSection = section;
  document.getElementById('section-modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  ['dialer', 'kpis', 'smstmpl'].forEach(s => {
    const btn = document.getElementById('hdr-' + s);
    if (btn) btn.classList.toggle('active', s === section);
  });
  if (section === 'dialer') renderDialer();
  else if (section === 'kpis') renderKPIs();
  else if (section === 'smstmpl') renderSmsTemplates();
  modalScrollTop();
}
function closeSectionModal() {
  modalSection = null;
  document.getElementById('section-modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
  ['dialer', 'kpis', 'smstmpl'].forEach(s => {
    const btn = document.getElementById('hdr-' + s);
    if (btn) btn.classList.remove('active');
  });
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modalSection) closeSectionModal();
});

/* ================= Tab switching + boot ================= */
function switchTab(t) {
  if (modalSection) closeSectionModal();
  tab = t; openDealId = null; openBuyerId = null;
  if (window._buyerMap) { try { window._buyerMap.remove(); } catch (e) {} window._buyerMap = null; }
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
  if (t === 'deals') renderDeals();
  else if (t === 'buyers') renderBuyers();
  else renderBuyerSearch(); // find
}
document.querySelectorAll('.tab-btn').forEach(b => b.onclick = () => switchTab(b.dataset.tab));

// Mobile: fade header on scroll down, return on scroll up
(function initMobileHeaderFade() {
  let lastY = 0, ticking = false;
  window.addEventListener('scroll', () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      ticking = false;
      if (window.innerWidth > 640) return;
      const header = $('site-header');
      if (!header) return;
      const y = window.scrollY;
      if (y > 120 && y > lastY + 4) header.classList.add('header-hidden');
      else if (y <= 120) header.classList.remove('header-hidden');
      lastY = y;
    });
  }, { passive: true });
})();

(async function boot() {

  const pubDeal = new URLSearchParams(location.search).get('deal');

  $('content').innerHTML = '<div class="empty-state">Loading…</div>';
  try { await loadAll(); } catch (e) { console.error(e); }
  loadSmsTemplates().catch(() => {}); // warm the SMS template cache (non-blocking)
  switchTab('find');
})();

async function saveDealForm(id) {
  const v = k => ($('df-' + k) || {}).value?.trim() || '';
  const num = k => { const x = v(k).replace(/[^0-9.]/g, ''); return x === '' ? '' : +x; };
  const rec = {
    address: v('address'), city: v('city'), state: v('state') || 'GA', zip: v('zip'), county: v('county'),
    propertyType: v('propertyType'), beds: num('beds'), baths: num('baths'), sqft: num('sqft'), yearBuilt: num('yearBuilt'), lotSize: v('lotSize'),
    contractPrice: num('contractPrice'), arv: num('arv'), rehabFlip: num('rehabFlip'), rehabRentReady: num('rehabRentReady'),
    askPrice: num('askPrice'), assignmentFee: num('assignmentFee'), closeByDate: v('closeByDate'),
    sellerName: v('sellerName'), sellerPhone: v('sellerPhone'), notes: $('df-notes').value.trim(),
    compRoof: v('compRoof'), compHvac: v('compHvac'), compPlumbing: v('compPlumbing'), compCosmetic: v('compCosmetic'),
    condRoof: $('df-condRoof').value.trim(), condHvac: $('df-condHvac').value.trim(),
    condPlumbing: $('df-condPlumbing').value.trim(), condElectrical: $('df-condElectrical').value.trim(),
    condFoundation: $('df-condFoundation').value.trim(), condInterior: $('df-condInterior').value.trim(),
    condOther: $('df-condOther').value.trim(),
    transWalkthrough: $('df-transWalkthrough').value.trim(), transClosing: $('df-transClosing').value.trim(),
    transOccupancy: $('df-transOccupancy').value.trim(), transAccess: $('df-transAccess').value.trim(),
    transTitle: $('df-transTitle').value.trim(), transEmd: $('df-transEmd').value.trim(),
    transPof: ($('df-transPof') || {}).value || '',
    driveFolderUrl: v('driveFolderUrl'), headline: v('headline'),
    slug: (v('address') || '').replace(/[^a-zA-Z0-9]/g, ''),
    updatedAt: new Date().toISOString()
  };
  if (!rec.address) { showToast('Address is required'); return; }
  if (id) {
    await db.collection('dispoDeals').doc(id).set(rec, { merge: true });
    showToast('Deal saved');
    await loadAll(); openDeal(id);
  } else {
    rec.stage = 'under_contract';
    rec.createdAt = new Date().toISOString();
    const ref = await db.collection('dispoDeals').add(rec);
    await logActivity(ref.id, 'Deal created — under contract');
    if (window.pendingDealSearchId) {
      try {
        await db.collection('dispoBuyerSearches').doc(window.pendingDealSearchId).update({ dealId: ref.id });
      } catch (e) { console.error('search link failed', e); }
    }
    window.pendingDealSearchId = '';
    showToast('Deal added');
    await loadAll(); openDeal(ref.id);
  }
}

async function deleteDeal(id) {
  const d = deals.find(x => x.id === id);
  showToast('Deleting deal…');
  const wipe = async (coll) => {
    const snap = await db.collection(coll).where('dealId', '==', id).get();
    for (const doc of snap.docs) await db.collection(coll).doc(doc.id).delete();
  };
  await wipe('dispoOffers');
  await wipe('dispoComps');
  await wipe('dispoActivity');
  await db.collection('dispoDeals').doc(id).delete();
  showToast('Deal deleted');
  await loadAll();
  switchTab('deals');
}

/* Double-click to edit deal numbers (Contract, ARV, Flip Rehab, Rent-Ready, Ask). */
function editDealNumber(dealId, field, el) {
  if (el.querySelector('input')) return; // already editing
  const d = deals.find(x => x.id === dealId);
  const cur = d ? (d[field] == null ? '' : d[field]) : '';
  el.innerHTML = `<input type="number" inputmode="decimal" value="${esc(String(cur))}" style="width:100%;">`;
  const input = el.querySelector('input');
  input.focus(); input.select();
  const commit = async (save) => {
    if (save) await saveDealNumber(dealId, field, input.value);
    else openDeal(dealId); // cancel → re-render
  };
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); commit(true); }
    else if (e.key === 'Escape') { commit(false); }
    e.stopPropagation();
  });
  input.addEventListener('blur', () => commit(true));
  input.addEventListener('click', (e) => e.stopPropagation());
  input.addEventListener('dblclick', (e) => e.stopPropagation());
}
async function saveDealNumber(dealId, field, rawVal) {
  const v = rawVal === '' ? null : +String(rawVal).replace(/[^0-9.]/g, '');
  const val = (rawVal === '' || isNaN(v)) ? null : v;
  try {
    await db.collection('dispoDeals').doc(dealId).set({ [field]: val, updatedAt: new Date().toISOString() }, { merge: true });
    const d = deals.find(x => x.id === dealId);
    if (d) d[field] = val;
    showToast('Saved ✓');
  } catch (e) { console.error('saveDealNumber failed', e); showToast('Save failed'); }
  openDeal(dealId); // re-render with updated + recalculated values
}

const driveCache = {}; // folderId -> { status, files, name }
let editingDriveFor = null;
function extractDriveFolderId(url) {
  if (!url) return null;
  const m = url.match(/folders\/([a-zA-Z0-9_-]+)/);
  return m ? m[1] : null;
}
async function saveDriveLink(dealId) {
  const inp = document.getElementById('drive-link-input');
  const url = (inp.value || '').trim();
  if (!url) { showToast('Paste a Drive folder link first'); return; }
  if (!extractDriveFolderId(url)) { showToast("That doesn't look like a Drive folder link", 'error'); return; }
  await db.collection('dispoDeals').doc(dealId).set({ driveFolderUrl: url, updatedAt: new Date().toISOString() }, { merge: true });
  editingDriveFor = null;
  await loadAll(); openDeal(dealId);
  showToast('Photo folder saved');
}
async function fetchDrivePhotos(dealId, folderUrl) {
  const container = document.getElementById('drive-carousel-' + dealId);
  if (!container) return;
  const folderId = extractDriveFolderId(folderUrl);
  if (!folderId) { container.innerHTML = `<div class="drive-carousel-msg">Couldn't read a folder link from that URL.</div>`; return; }
  if (driveCache[folderId] && driveCache[folderId].status === 'done') { renderDriveCarousel(dealId, driveCache[folderId].files); return; }
  if (driveCache[folderId] && driveCache[folderId].status === 'error') {
    container.innerHTML = `<div class="drive-carousel-msg">Couldn't load photos — make sure the folder is shared as "Anyone with the link".</div>`; return;
  }
  container.innerHTML = `<div class="drive-carousel-msg">Loading photos…</div>`;
  try {
    const q = encodeURIComponent(`'${folderId}' in parents and mimeType contains 'image/' and trashed = false`);
    const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&key=${GOOGLE_API_KEY}&fields=files(id,name,thumbnailLink)&pageSize=50`);
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    const files = data.files || [];
    driveCache[folderId] = { status: 'done', files };
    renderDriveCarousel(dealId, files);
  } catch (e) {
    driveCache[folderId] = { status: 'error' };
    container.innerHTML = `<div class="drive-carousel-msg">Couldn't load photos — make sure the folder is shared as "Anyone with the link".</div>`;
  }
}
function renderDriveCarousel(dealId, files) {
  const container = document.getElementById('drive-carousel-' + dealId);
  if (!container) return;
  if (!files.length) { container.innerHTML = `<div class="drive-carousel-msg">No images found in that folder yet.</div>`; return; }
  const deal = (typeof deals !== 'undefined' ? deals.find(x => x.id === dealId) : null) || {};
  const masterId = deal.masterPhotoId || '';
  const master = deal.masterPhoto || '';
  container.innerHTML = files.map(f => {
    const big = (f.thumbnailLink || '').replace(/=s\d+.*$/, '=s1200');
    const isMaster = (masterId && f.id === masterId) || (!!master && (master === big || (f.id && master.indexOf(f.id) !== -1)));
    return `<div class="drive-thumb-wrap${isMaster ? ' is-master' : ''}">
      <a href="https://drive.google.com/file/d/${f.id}/view" target="_blank" rel="noopener" class="drive-thumb-link" title="${esc(f.name)}">
        <img src="${f.thumbnailLink}" class="drive-thumb" loading="lazy" />
      </a>
      ${isMaster ? '<span class="master-badge">★ Master</span>' : `<button class="master-btn" onclick="setMasterPhoto('${dealId}','${f.id}')" title="Set as master photo">★</button>`}
    </div>`;
  }).join('') + `<div class="drive-carousel-msg" style="flex:0 0 auto;align-self:center;">Tap ★ on a photo to make it the master thumbnail.</div>`;
}
async function setMasterPhoto(dealId, fileId) {
  const deal = (typeof deals !== 'undefined' ? deals.find(x => x.id === dealId) : null) || {};
  try {
    // Store the file ID (permanent) — the site builds a stable thumbnail URL from it.
    // The signed thumbnailLink expires, so we don't rely on the full URL anymore.
    await db.collection('dispoDeals').doc(dealId).update({ masterPhotoId: fileId, masterPhoto: '' });
    if (deal.id) { deal.masterPhotoId = fileId; deal.masterPhoto = ''; }
    const folderId = extractDriveFolderId(deal.driveFolderUrl || '');
    const files = ((typeof driveCache !== 'undefined' && driveCache[folderId]) || {}).files || [];
    renderDriveCarousel(dealId, files);
    showToast('★ Master photo set — used on the deals page, emails & text previews');
  } catch (e) { showToast('Could not save — try again'); }
}
async function fetchDriveFolderName(dealId, folderUrl) {
  const linkEl = document.getElementById('drive-link-name-' + dealId);
  if (!linkEl) return;
  const folderId = extractDriveFolderId(folderUrl);
  if (!folderId) { linkEl.textContent = '📁 Open Photos'; return; }
  if (driveCache[folderId] && driveCache[folderId].name) { linkEl.textContent = '📁 ' + driveCache[folderId].name; return; }
  try {
    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${folderId}?key=${GOOGLE_API_KEY}&fields=name`);
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    driveCache[folderId] = { ...(driveCache[folderId] || {}), name: data.name };
    const stillThere = document.getElementById('drive-link-name-' + dealId);
    if (stillThere) stillThere.textContent = '📁 ' + data.name;
  } catch (e) {
    const stillThere = document.getElementById('drive-link-name-' + dealId);
    if (stillThere) stillThere.textContent = '📁 Open Photos';
  }
}

async function saveOffer(dealId) {
  const amount = +($('of-amount').value || 0);
  if (!amount) { showToast('Offer amount is required'); return; }
  const buyerSel = $('of-buyer').value;
  let buyerId = null, buyerName = '';
  if (buyerSel === 'NEW') {
    buyerName = $('of-new-name').value.trim();
    if (!buyerName) { showToast('New buyer name is required'); return; }
    const newBuyer = {
      name: buyerName,
      phone: $('of-new-phone').value.trim(),
      email: $('of-new-email').value.trim(),
      source: 'manual_offer',
      dealId,
      createdAt: new Date().toISOString()
    };
    const ref = await db.collection('dispoBuyers').add(newBuyer);
    buyerId = ref.id;
    buyers.push({ id: buyerId, ...newBuyer });
  } else if (buyerSel) {
    buyerId = buyerSel;
    const b = buyers.find(x => x.id === buyerSel);
    buyerName = b ? b.name : '';
  } else {
    showToast('Select a buyer'); return;
  }
  await db.collection('dispoOffers').add({
    dealId,
    buyerId: buyerId || '',
    buyerName,
    amount,
    emd: +($('of-emd').value || 0) || '',
    closeDate: $('of-close').value || '',
    notes: $('of-notes').value.trim(),
    status: 'pending',
    createdAt: new Date().toISOString()
  });
  await logActivity(dealId, `Offer logged: ${money(amount)} from ${buyerName}`);
  const d = deals.find(x => x.id === dealId);
  if (d && d.stage === 'marketing') {
    await db.collection('dispoDeals').doc(dealId).set({ stage: 'offers_in' }, { merge: true });
    await logActivity(dealId, 'Stage → Offers In');
  }
  showToast('Offer logged');
  await loadAll(); openDeal(dealId);
}

  const mao = arv ? Math.round(arv * pct / 100 - repairs - fee) : null;

  return `<div style="background:rgba(0,0,0,.25);border:1px solid #22385a;border-radius:12px;padding:14px;margin-bottom:6px;">

/* ================= Find Buyers (InvestorBase search) =================
   DISPO MANAGER handoff contract (InvestorBase is the ONLY buyer source):
   - Luca queues a search here → doc in `dispoBuyerSearches`:
     { address, propertyTypes[], radiusMiles, monthsBack: 12 (hardcoded), notes,
       status: 'queued', lat, lng, createdAt }
     Lookback never exceeds 12 months — no user control.
   - DISPO MANAGER runs the InvestorBase pull per SOP (skip-trace-and-save before
     search, buyer-type filters matched to propertyTypes, radius from 0.5 mi
     expanding until ≥10 buyers, no cap), creates/updates `dispoBuyers` docs
     (with firstName/lastName + boughtPropertyAddress/Price/Details), and links
     each buyer to the search AND the deal via `dispoBuyerSearchResults`:
     { searchId, dealId, buyerId, createdAt }
     (legacy purchase fields buyerName/purchaseAddress/soldPrice/soldDate/lat/lng
     may also be present on result docs for the map — rendered defensively).
   - She flips the search status to 'complete' when done.
   - In-app: "🔗 Link buyers to deal" on a search links all its pushed buyers at
     once; per-result "🔗 Deal" links one; buyer card "🔗 Link to Deal" links a
     buyer directly. Deal detail shows them under "⭐ Priority Buyers" (InvestorBase rank order). */
const PTYPE_OPTIONS = ['Single Family','Duplex','Triplex','Quad','Multi-Family','Condo','Mobile Home','Townhome','Land','Commercial','Other'];
// Multi-select property-type chips (gold = selected)
function ptypeChipsHTML(containerId, selected) {
  const sel = selected || [];
  return `<div id="${containerId}" style="display:flex;flex-wrap:wrap;gap:8px;">` +
    PTYPE_OPTIONS.map(o => {
      const on = sel.includes(o);
      return `<button type="button" data-pt="${o}" data-sel="${on ? '1' : ''}" style="padding:10px 14px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;${on ? 'background:#d4a843;border:1px solid #d4a843;color:#0b1626;' : 'background:rgba(18,37,64,.85);border:1px solid #2f4d78;color:#9aa7ba;'}">${o}</button>`;
    }).join('') + `</div>`;
}
function wirePtypeChips(containerId) {
  document.querySelectorAll(`#${containerId} [data-pt]`).forEach(btn => {
    btn.onclick = () => {
      const on = btn.dataset.sel === '1';
      btn.dataset.sel = on ? '' : '1';
      btn.style.cssText = 'padding:10px 14px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;' + (on
        ? 'background:rgba(18,37,64,.85);border:1px solid #2f4d78;color:#9aa7ba;'
        : 'background:#d4a843;border:1px solid #d4a843;color:#0b1626;');
    };
  });
}
function getSelectedPtypes(containerId) {
  return [...document.querySelectorAll(`#${containerId} [data-pt]`)].filter(b => b.dataset.sel === '1').map(b => b.dataset.pt);
}
// Display: new docs store propertyTypes[]; older docs have a propertyType string
function fmtSearchTypes(s) {
  const arr = Array.isArray(s.propertyTypes) ? s.propertyTypes : (s.propertyType ? [s.propertyType] : []);
  return arr.length ? arr.join(', ') : '—';
}
async function geocodeAddress(addr) {
  try {
    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(addr);
    const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
    const data = await res.json();
    if (data && data.length) return { lat: +data[0].lat, lng: +data[0].lon };
  } catch (e) {}
  return null;
}
// Street addresses often don't resolve (rural/new) — fall back to city/state/ZIP,
// then city/state, so the subject pin still lands near the property.
async function geocodeAddressFallback(address) {
  const parts = String(address || '').split(',').map(s => s.trim()).filter(Boolean);
  for (let i = 0; i < parts.length; i++) {
    const q = parts.slice(i).join(', ');
    if (!q) continue;
    try {
      const g = await geocodeAddress(q + ', USA');
      if (g && g.lat && g.lng) return g;
    } catch (e) {}
  }
  return null;
}

async function queueBuyerSearch({ address, propertyTypes, radiusMiles, notes, dealId }) {
  showToast('Locating property…');

  const rec = {
    address, propertyTypes: propertyTypes || [], radiusMiles: radiusMiles || 0.5, monthsBack: 12, notes: notes || '',
    status: 'queued',
    lat: geo ? geo.lat : '', lng: geo ? geo.lng : '',
    createdAt: new Date().toISOString()
  };
  if (dealId) rec.dealId = dealId;

  showToast('Search queued — DISPO MANAGER is on it');

}

function initBuyerMap(s, results) {
  try {
    if (window._buyerMap) { window._buyerMap.remove(); window._buyerMap = null; }
    const map = L.map('buyer-map').setView([s.lat, s.lng], 13);
    window._buyerMap = map;
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
    // Radius circle
    L.circle([s.lat, s.lng], {
      radius: s.radiusMiles * 1609.34, color: '#d4a843', weight: 2,
      fillColor: '#d4a843', fillOpacity: 0.08, dashArray: '6 6'
    }).addTo(map);
    // Subject marker (red pin, always on top)
    const starIcon = L.divIcon({
      className: '', html: '<div style="font-size:40px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.75));">📍</div>',
      iconSize: [40, 40], iconAnchor: [20, 38]
    });
    L.circle([s.lat, s.lng], { radius: 900, color: '#e05252', weight: 2.5, fillColor: '#e05252', fillOpacity: 0.07, dashArray: '10 8' }).addTo(map);
    L.marker([s.lat, s.lng], { icon: starIcon, zIndexOffset: 1000 }).addTo(map)
      .bindPopup(`<b>Subject</b><br>${esc(s.address)}`);
    // Buyer purchase markers (blue)
    const dotIcon = L.divIcon({
      className: '', html: '<div style="width:16px;height:16px;border-radius:50%;background:#4a9fe0;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.5);"></div>',
      iconSize: [16, 16], iconAnchor: [8, 8]
    });
    const pts = [[s.lat, s.lng]];
    results.forEach(r => {
      if (!r.lat || !r.lng) return;
      pts.push([r.lat, r.lng]);
      L.marker([r.lat, r.lng], { icon: dotIcon }).addTo(map)
        .bindPopup(`<b>${esc(r.buyerName || '')}</b><br>💰 ${money(r.soldPrice)} · ${esc(fmtDate(r.soldDate))}<br>📍 ${esc(r.purchaseAddress || '')}`);
    });
    if (pts.length > 1) map.fitBounds(pts, { padding: [30, 30] });
    setTimeout(() => map.invalidateSize(), 300);
  } catch (e) { console.error('map failed', e); }
}
function buyerPinColor(type) {
  const t = (type || '').toLowerCase();
  if (/llc|corp|inc\b|reit|partner|entity|holding/.test(t)) return '#4caf82';
  if (/individual/.test(t)) return '#4a9fe0';
  if (/trust/.test(t)) return '#c084fc';
  return '#8a97a8';
}
function buyerDotIcon(color) {
  return L.divIcon({
    className: '',
    html: '<div style="width:18px;height:18px;border-radius:50%;background:' + color + ';border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.5);"></div>',
    iconSize: [18, 18], iconAnchor: [9, 9]
  });
}
async function initDealBuyerMap(deal, pulledBuyers) {
  const mapEl = document.getElementById('deal-buyer-map');
  const statusEl = document.getElementById('deal-map-status');
  const countEl = document.getElementById('deal-map-count');
  if (!mapEl || typeof L === 'undefined') return;
  const setStatus = txt => { if (statusEl) statusEl.textContent = txt || ''; };
  try {
    if (window._dealBuyerMap) { window._dealBuyerMap.remove(); window._dealBuyerMap = null; }
    if (!pulledBuyers.length) {
      mapEl.innerHTML = '<div class="timeline-empty">No pulled buyers linked yet — link them from 🔍 Find Buyers.</div>';
      return;
    }
    // Deal location: linked search lat/lng first, else geocode the deal address
    let dealGeo = null;
    const searchIds = [...new Set(pulledBuyers.map(pb => pb.searchId).filter(Boolean))];
    for (const sid of searchIds) {
      try {
        const sdoc = await db.collection('dispoBuyerSearches').doc(sid).get();
        const s = sdoc.exists ? sdoc.data() : null;
        if (s && s.lat && s.lng) { dealGeo = { lat: +s.lat, lng: +s.lng }; break; }
      } catch (e) {}
    }
    if (!dealGeo) {
      const daddr = [deal.address, deal.city, deal.state, deal.zip].filter(Boolean).join(', ');
      if (daddr) { try { dealGeo = await geocodeAddressFallback(daddr); } catch (e) {} }
    }
    // Buyer pins: cached coords first, then Nominatim at max 1 req/sec, caching back to the buyer doc
    const pins = [];
    const toLocate = [];
    pulledBuyers.forEach(pb => {
      const b = pb._buyer;
      const lat = (b && b.buyerLat) || pb.lat || '';
      const lng = (b && b.buyerLng) || pb.lng || '';
      if (lat && lng) pins.push({ pb, lat: +lat, lng: +lng });
      else toLocate.push(pb);
    });
    if (!dealGeo && !pins.length && !toLocate.length) {
      mapEl.innerHTML = '<div class="timeline-empty">No mappable locations yet.</div>';
      return;
    }
    // Draw the map NOW with the subject + already-located buyers; the rest
    // resolve in the background (1 lookup/sec rate limit) and drop in as they land.
    const map = L.map('deal-buyer-map').setView(
      dealGeo ? [dealGeo.lat, dealGeo.lng] : (pins.length ? [pins[0].lat, pins[0].lng] : [33.749, -84.388]), 11);
    window._dealBuyerMap = map;
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
    const pts = [];
    let buyerPinCount = 0;
    const paintCount = () => { if (countEl) countEl.textContent = '(' + buyerPinCount + ')'; };
    if (dealGeo) {
      pts.push([dealGeo.lat, dealGeo.lng]);
      const subjectIcon = L.divIcon({
        className: '',
        html: '<div style="font-size:40px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.75));">📍</div>',
        iconSize: [40, 40], iconAnchor: [20, 38]
      });
      L.circle([dealGeo.lat, dealGeo.lng], { radius: 900, color: '#e05252', weight: 2.5, fillColor: '#e05252', fillOpacity: 0.07, dashArray: '10 8' }).addTo(map);
      L.marker([dealGeo.lat, dealGeo.lng], { icon: subjectIcon, zIndexOffset: 1000 }).addTo(map)
        .bindPopup('<b>🏠 Deal (subject)</b><br>' + esc(deal.address || ''));
    }
    const addBuyerPin = (pb, lat, lng) => {
      const b = pb._buyer;
      const nm = (b && (b.firstName || b.lastName) ? [b.firstName, b.lastName].filter(Boolean).join(' ') : (b && b.name)) || pb.buyerName || 'Unknown buyer';
      const addr = (b && b.boughtPropertyAddress) || pb.boughtPropertyAddress || pb.purchaseAddress || '';
      const price = (b && b.boughtPropertyPrice) || pb.boughtPropertyPrice || (pb.soldPrice ? String(pb.soldPrice) : '');
      pts.push([lat, lng]);
      buyerPinCount++;
      const popup = '<b>' + esc(nm) + '</b>'
        + (b && b.phone ? '<br>\uD83D\uDCDE <a href="tel:' + digitsOnly(b.phone) + '" onclick="logDispoDialClick(\'' + (b.id || '') + '\',\'' + deal.id + '\')" style="color:#1a6fd4;font-weight:700;">' + esc(formatPhone(b.phone)) + '</a>' : '')
        + (addr ? '<br>\uD83D\uDCCD ' + esc(addr) : '')
        + (price ? '<br>\uD83D\uDCB0 ' + esc(price) : '');
      L.marker([lat, lng], { icon: buyerDotIcon(buyerPinColor(b && b.type)) }).addTo(map).bindPopup(popup);
    };
    pins.forEach(({ pb, lat, lng }) => addBuyerPin(pb, lat, lng));
    paintCount();
    if (pts.length > 1) map.fitBounds(pts, { padding: [30, 30] });
    setTimeout(() => map.invalidateSize(), 300);
    // Background: resolve the remaining buyers without blocking the map.
    // Nominatim allows 1 req/sec — each pin drops in as its lookup completes,
    // and coords cache back to the buyer doc so next visit is instant.
    if (toLocate.length) {
      setStatus('Locating ' + toLocate.length + ' buyer' + (toLocate.length === 1 ? '' : 's') + ' on map…');
      (async () => {
        let added = 0;
        for (const pb of toLocate) {
          if (!window._dealBuyerMap) break; // user navigated away
          const b = pb._buyer;
          const addr = (b && b.boughtPropertyAddress) || pb.boughtPropertyAddress || pb.purchaseAddress || '';
          if (addr) {
            let geo = null;
            try { geo = await geocodeAddress(addr + ', USA'); } catch (e) {}
            try { await new Promise(r => setTimeout(r, 1100)); } catch (e) {}
            if (geo && geo.lat && geo.lng) {
              addBuyerPin(pb, +geo.lat, +geo.lng);
              added++;
              paintCount();
              if (b && b.id) {
                try {
                  await db.collection('dispoBuyers').doc(b.id).set({ buyerLat: +geo.lat, buyerLng: +geo.lng }, { merge: true });
                  b.buyerLat = +geo.lat; b.buyerLng = +geo.lng;
                } catch (e) {}
              }
            }
          }
        }
        if (added && window._dealBuyerMap) { try { map.fitBounds(pts, { padding: [30, 30] }); } catch (e) {} }
        setStatus('');
      })();
    } else {
      setStatus('');
    }
  } catch (e) { console.error('deal buyer map failed', e); }
}
async function logSearchResult(searchId) {

  if (!buyerName || !purchaseAddress) { showToast('Buyer name and purchase address are required'); return; }

    soldPrice: +($('br-price').value || 0) || '',

  });

}
async function deleteBuyerSearch(id) {

async function pushResultToBuyers(resultId) {  const doc = await db.collection('dispoBuyerSearchResults').doc(resultId).get();
  if (!doc.exists) return;
  const r = doc.data();
  // Avoid dupes: match by name
  const existing = buyers.find(b => String(b.name || '').toLowerCase() === String(r.buyerName || '').toLowerCase());
  const nameParts = String(r.buyerName || '').trim().split(/\s+/).filter(Boolean);
  const boughtFields = {
    firstName: nameParts[0] || '', lastName: nameParts.slice(1).join(' ') || '',
    boughtPropertyAddress: r.purchaseAddress || '',
    boughtPropertyPrice: r.soldPrice ? String(r.soldPrice) : '',
    boughtPropertyDetails: [r.soldDate ? 'Sold ' + fmtDate(r.soldDate) : '', r.purchaseAddress ? 'Cash purchase' : ''].filter(Boolean).join(' · ')
  };
  let buyerId;
  if (existing) {
    buyerId = existing.id;
    await db.collection('dispoBuyers').doc(buyerId).set({
      ...boughtFields,
      sourceDetail: ((existing.sourceDetail || '') + ` | Buyer search: ${r.purchaseAddress} ${money(r.soldPrice)} (${fmtDate(r.soldDate)})`).trim(),
      updatedAt: new Date().toISOString()
    }, { merge: true });
  } else {
    const ref = await db.collection('dispoBuyers').add({
      name: r.buyerName, type: '', phone: '', email: '', mailingAddress: '',
      buyingCity: '', buyingCounty: '', buyingZip: '',
      buyBox: '', source: 'Buyer Search', sourceDetail: `${r.purchaseAddress} — cash ${money(r.soldPrice)} (${fmtDate(r.soldDate)})`,
      cashBuys12mo: '1', dateAdded: new Date().toISOString().slice(0, 10),
      lastVerified: new Date().toISOString().slice(0, 10),
      notes: '', status: 'active', ...boughtFields, updatedAt: new Date().toISOString()
    });
    buyerId = ref.id;
  }
  const sdoc0 = r.searchId ? await db.collection('dispoBuyerSearches').doc(r.searchId).get() : null;
  const autoDealId = sdoc0 && sdoc0.exists ? (sdoc0.data().dealId || '') : '';
  await db.collection('dispoBuyerSearchResults').doc(resultId).set(
    autoDealId ? { buyerId, dealId: autoDealId } : { buyerId }, { merge: true });
  showToast((existing ? 'Linked to existing buyer' : 'Buyer added to Buyers DB') + (autoDealId ? ' — linked to deal' : ''));
  await loadAll();
  const sdoc = await db.collection('dispoBuyerSearches').doc(r.searchId).get();
  if (sdoc.exists) openBuyerSearch(r.searchId);
}

function pickDeal(title, cb) {
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;';
  ov.innerHTML = `<div style="background:#10233d;border:1px solid #22385a;border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:70vh;overflow:auto;padding:18px;">
    <h3 style="margin:0 0 4px;font-size:17px;">${esc(title)}</h3>
    <div class="addr-sub" style="margin-bottom:12px;">Pick the deal to attach to.</div>
    ${deals.length ? deals.map(d => `<button class="btn-ghost" style="width:100%;text-align:left;margin-bottom:8px;" data-dealpick="${d.id}">📍 ${esc(d.address || 'Untitled deal')}${d.city ? '<span style="color:#8a97a8;"> · ' + esc(d.city) + '</span>' : ''}</button>`).join('') : '<div class="timeline-empty">No deals yet.</div>'}
    <button class="btn-ghost" style="width:100%;margin-top:4px;" id="deal-picker-cancel">Cancel</button>
  </div>`;
  document.body.appendChild(ov);
  ov.querySelector('#deal-picker-cancel').onclick = () => ov.remove();
  ov.onclick = e => { if (e.target === ov) ov.remove(); };
  ov.querySelectorAll('[data-dealpick]').forEach(b => b.onclick = () => { const id = b.getAttribute('data-dealpick'); ov.remove(); cb(id); });
}
async function linkResultToDeal(resultId) {
  pickDeal('Link buyer to deal', async (dealId) => {
    await db.collection('dispoBuyerSearchResults').doc(resultId).set({ dealId, updatedAt: new Date().toISOString() }, { merge: true });
    showToast('Buyer linked to deal');
    const doc = await db.collection('dispoBuyerSearchResults').doc(resultId).get();
    if (doc.exists && doc.data().searchId) openBuyerSearch(doc.data().searchId);
  });
}
async function linkSearchToDeal(searchId) {
  pickDeal('Link search buyers to deal', async (dealId) => {
    const rsnap = await db.collection('dispoBuyerSearchResults').where('searchId', '==', searchId).get();
    let n = 0;

    showToast(n ? n + ' buyer' + (n === 1 ? '' : 's') + ' linked to deal' : 'No pushed buyers on this search yet');
    openBuyerSearch(searchId);
  });
}
async function linkBuyerToDeal(buyerId) {
  pickDeal('Link buyer to deal', async (dealId) => {

}

async function renderKPIs() {
  sectionContentEl().innerHTML = '<div class="empty-state">Loading KPIs…</div>';
  const offersSnap = await db.collection('dispoOffers').get();
  const offers = offersSnap.docs.map(o => o.data());
  const active = deals.filter(d => !['closed', 'dead'].includes(d.stage));
  const closedDeals = deals.filter(d => d.stage === 'closed');
  const assignedDeals = deals.filter(d => d.stage === 'assigned');
  const totalFees = closedDeals.reduce((s, d) => s + (+d.assignmentFee || 0), 0);
  // Avg days under contract → assigned/closed
  let daySum = 0, dayN = 0;
  deals.forEach(d => {
    if (['assigned', 'closed'].includes(d.stage) && d.createdAt && d.updatedAt) {
      const days = (new Date(d.updatedAt) - new Date(d.createdAt)) / 86400000;
      if (days >= 0 && days < 365) { daySum += days; dayN++; }
    }
  });
  const stat = (label, val, sub) => `
    <div class="num-box" style="padding:16px;">
      <div class="l">${label}</div>
      <div class="v" style="font-size:26px;">${val}</div>
      ${sub ? `<div style="font-size:12px;color:#8a97a8;margin-top:4px;">${sub}</div>` : ''}
    </div>`;
  sectionContentEl().innerHTML = `
    <div class="num-grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));">
      ${stat('Active deals', active.length, 'under contract → offers in')}
      ${stat('Total offers', offers.length, 'across all deals')}
      ${stat('Assigned', assignedDeals.length, '')}
      ${stat('Closed', closedDeals.length, '')}
      ${stat('Fees collected', money(totalFees), 'closed deals')}
      ${stat('Avg days to assign', dayN ? Math.round(daySum / dayN) : '—', dayN ? `over ${dayN} deals` : '')}
    </div>
    <div class="section-label">Deals by stage</div>
    ${DEAL_STAGES.map(s => {
      const c = deals.filter(d => d.stage === s.id).length;

let dialer = null; // {dealId, queue:[{buyer,score,why}], idx, outcomes:{}}
async function startDialer(dealId, onlyBuyerId) {
  const d = deals.find(x => x.id === dealId);
  if (!d) return;
  // Call session runs ONLY on this deal's InvestorBase-pulled buyers (no local auto-matching)
  let queue = [];
  try {
    const psnap = await db.collection('dispoBuyerSearchResults').where('dealId', '==', dealId).get();
    queue = psnap.docs.map(doc => ({ id: doc.id, ...doc.data() }))
      .sort((a, b) => tsStr(a.createdAt).localeCompare(tsStr(b.createdAt))) // InvestorBase rank order
      .filter(r => r.smartMatch === true) // Top Ranked: InvestorBase Smart Match only
      .map(r => {
        const b = r.buyerId ? (buyers.find(x => x.id === r.buyerId) || null) : null;
        if (!b) return null;
        const why = ['🏆 Smart Match · Pulled from InvestorBase'];
        const baddr = b.boughtPropertyAddress || r.boughtPropertyAddress || r.purchaseAddress || '';
        const bprice = b.boughtPropertyPrice || r.boughtPropertyPrice || (r.soldPrice ? String(r.soldPrice) : '');
        if (baddr || bprice) why.push('🏠 Bought: ' + baddr + (baddr && bprice ? ' for ' : '') + bprice);
        return { buyer: b, score: '', why };
      }).filter(Boolean);
  } catch (e) { queue = []; }
  if (onlyBuyerId) queue = queue.filter(q => q.buyer && q.buyer.id === onlyBuyerId);
  if (!queue.length) { showToast(onlyBuyerId ? 'Buyer not available for calling' : 'No Smart Match buyers on this deal yet'); return; }
  dialer = { dealId, queue, idx: 0, outcomes: {} };
  renderDealDialer();
}

function dialerCurrentOutcome() {
  const sel = document.querySelector('#dispo-dialer [data-outcome][data-selected]');
  const note = ($('dialer-note') || {}).value?.trim() || '';
  return { outcome: sel ? sel.dataset.outcome : '', note };
}
async function persistDialerOutcome() {
  const item = dialer.queue[dialer.idx];
  const { outcome, note } = dialerCurrentOutcome();
  if (!outcome && !note) return;
  dialer.outcomes[item.buyer.id] = { outcome, note };
  const d = deals.find(x => x.id === dialer.dealId);
  const txt = `📞 ${item.buyer.name}: ${outcome || 'note'}${note ? ' — ' + note : ''}`;
  await logActivity(dialer.dealId, txt);
  await db.collection('dispoBuyers').doc(item.buyer.id).set({
    lastContact: new Date().toISOString().slice(0, 10),
    lastOutcome: outcome || '',
    updatedAt: new Date().toISOString()
  }, { merge: true });
  if (outcome === 'Bad Number') {
    await db.collection('dispoBuyers').doc(item.buyer.id).set({ status: 'needs_retrace' }, { merge: true });
  }
}
async function dialerNext() {
  await persistDialerOutcome();
  document.getElementById('dispo-dialer').remove();
  if (dialer.idx < dialer.queue.length - 1) {
    dialer.idx++;
    renderDealDialer();
  } else {
    const n = Object.keys(dialer.outcomes).length;
    showToast(`Session done — ${n} buyer${n === 1 ? '' : 's'} logged`);
    dialer = null;
    await loadAll();
  }
}
function dialerNav(dir) {
  persistDialerOutcome().then(() => {
    document.getElementById('dispo-dialer').remove();
    dialer.idx = Math.max(0, Math.min(dialer.queue.length - 1, dialer.idx + dir));
    renderDealDialer();
  });
}
function closeDialer() {
  persistDialerOutcome().then(() => {
    const el = document.getElementById('dispo-dialer');
    if (el) el.remove();
    dialer = null;
    loadAll();
  });
}

async function quoPost(body) {
  // The proxy always answers HTTP 200 (even on failure) — must check the body's ok flag.
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 45000);
  let res;
  try {
    res = await fetch(QUO_PROXY_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body),
      signal: ctrl.signal,
    });
  } catch (e) {
    throw new Error(e && e.name === 'AbortError' ? 'Quo proxy timed out — the Apps Script web app may need redeploying' : 'Quo proxy unreachable: ' + ((e && e.message) || e));
  } finally { clearTimeout(timer); }
  if (!res.ok) throw new Error('Quo proxy failed (HTTP ' + res.status + ')');
  const data = await res.json().catch(() => ({}));
  if (data && data.ok === false) throw new Error('Quo error: ' + (data.error || 'proxy error'));
  return data;
}
function buyerSmsName(b, deal) {
  // Split name for createContact; company-looking names go in the company field so Quo shows them by name.
  // Everyone else gets "{city}, {state} Buyer" as company so Luca sees the market at a glance in Quo.
  const full = [b.firstName, b.lastName].filter(Boolean).join(' ').trim() || String(b.name || '').trim();
  const isCo = /\b(llc|inc|corp|properties|holdings|investments|group|partners|enterprises|ltd)\b/i.test(full);
  if (isCo) return { firstName: full, lastName: '', company: full };
  const parts = full.split(/\s+/).filter(Boolean);
  const city = String(b.buyingCity || '').trim();
  const st = String((deal && deal.state) || '').toUpperCase();
  const market = [city, st].filter(Boolean).join(', ');
  return { firstName: b.firstName || parts[0] || '', lastName: b.lastName || parts.slice(1).join(' ') || '', company: market ? market + ' Buyer' : 'Buyer' };
}

  const digits = digitsOnly(phone || '');

async function dealPhotoURLs(deal) {
  const urls = [];
  // Prefer the stable file-ID URL (never expires) over the legacy signed masterPhoto URL.
  if (deal && deal.masterPhotoId) urls.push('https://drive.google.com/thumbnail?id=' + deal.masterPhotoId + '&sz=s1200');
  else if (deal && deal.masterPhoto) urls.push(deal.masterPhoto);
  if (!deal || !deal.driveFolderUrl) return urls;
  const folderId = extractDriveFolderId(deal.driveFolderUrl);
  if (!folderId) return urls;
  try {
    const q = encodeURIComponent("'" + folderId + "' in parents and mimeType contains 'image/' and trashed = false");
    const res = await fetch('https://www.googleapis.com/drive/v3/files?q=' + q + '&key=' + GOOGLE_API_KEY + '&fields=files(id,thumbnailLink)&pageSize=12');
    const data = await res.json();
    for (const f of (data.files || [])) {
      const u = (f.thumbnailLink || '').replace(/=s\d+.*$/, '=s800');
      if (u && !urls.includes(u)) urls.push(u);
    }
    return urls;
  } catch (e) { return urls; }
}

function paceCountdown(ms) {

    const end = Date.now() + ms;
    const iv = setInterval(() => {
      if (!blastRun || blastRun.cancel) { clearInterval(iv); resolve(); return; }
      const left = Math.max(0, end - Date.now());
      const el = document.getElementById('eb-countdown');
      if (el) el.textContent = 'Next email in ' + Math.floor(left / 60000) + ':' + String(Math.floor(left % 60000 / 1000)).padStart(2, '0');
      if (left <= 0) { clearInterval(iv); resolve(); }
    }, 1000);
  });
}
async function startBlast(dealId) {
  const d = deals.find(x => x.id === dealId); if (!d || blastRun) return;

  let pulled = [];
  try { pulled = await dealPulledBuyers(dealId); } catch (e) { showToast('Could not load buyers'); return; }
  let recips = pulled.filter(r => r._buyer && r._buyer.email && r._buyer.status !== 'inactive');
  if (group === 'top') recips = recips.filter(r => r.smartMatch === true);
  // Safety net: never re-email a buyer already emailed for this deal (e.g. via a one-off email).
  const contactedNow = await contactedBuyerIds(dealId, 'dispoEmailBlasts');
  recips = recips.filter(r => !contactedNow.has(r._buyer.id));
  if (!recips.length) { showToast('No recipients in this group'); return; }
  const mins = Math.ceil(recips.length * 1.5);
  if (!confirm('Send ' + recips.length + ' emails, one every 90 seconds (~' + mins + ' min)?\n\nKeep DispoHub open until it finishes.')) return;
  const sendBtn = document.getElementById('eb-send'); if (sendBtn) sendBtn.disabled = true;
  const prog = document.getElementById('eb-progress');
  const subjTpl = ($('eb-subject') || {}).value || defaultEmailSubject();
  const bodyTpl = ($('eb-body') || {}).value || defaultEmailBody();
  blastRun = { cancel: false, finished: false };
  let ok = 0, fail = 0; const logArr = []; const sentIds = [];
  const pushLog = line => { logArr.push(line); if (logArr.length > 60) logArr.shift(); };
  const renderProg = (done, note) => {
    if (!prog) return;
    prog.style.display = 'block';
    const pct = Math.round(done / recips.length * 100);
    prog.innerHTML = '<div class="detail-card"><div class="section-label" style="margin-top:0;">Sending… ' + done + ' of ' + recips.length + '</div>' +
      '<div style="height:10px;background:#0b1626;border-radius:6px;overflow:hidden;margin-bottom:10px;"><div style="height:100%;width:' + pct + '%;background:linear-gradient(90deg,#d4a843,#e8c476);"></div></div>' +
      '<div id="eb-countdown" style="font-size:13px;color:#8a97a8;margin-bottom:8px;">' + esc(note || '') + '</div>' +
      '<div id="eb-log" style="font-size:12px;color:#aeb9c7;max-height:180px;overflow-y:auto;background:#0b1626;border-radius:8px;padding:10px;">' + logArr.map(l => '<div>' + esc(l) + '</div>').join('') + '</div>' +
      '<button class="btn-ghost" style="width:100%;min-height:48px;margin-top:10px;" onclick="cancelBlast()">⏹ Cancel Blast</button></div>';
    const lg = document.getElementById('eb-log'); if (lg) lg.scrollTop = lg.scrollHeight;
  };
  let blastRef = null;
  try { blastRef = await db.collection('dispoEmailBlasts').add({ type: 'blast', dealId, dealAddress: d.address, startedAt: new Date().toISOString(), total: recips.length, sent: 0, failed: 0, status: 'running' }); } catch (e) { console.warn('blast log failed', e); }
  renderProg(0, 'Preparing preview image…');
  let pngB64 = '', photoURL = '';
  try { const urls = await dealPhotoURLs(d); photoURL = urls[0] || ''; pngB64 = await dealPreviewPNG(d); }
  catch (e) { pushLog('⚠️ Preview image failed (' + e.message + ') — sending without attachment'); }
  const atts = pngB64 ? [{ filename: 'deal-preview.png', mime: 'image/png', b64: pngB64 }] : [];
  for (let i = 0; i < recips.length; i++) {
    if (!blastRun || blastRun.cancel) break;
    const b = recips[i]._buyer;
    const bodyFilled = fillBody(bodyTpl, d, b);
    try {
      await sendDealEmail(b.email, fillSubject(subjTpl, d, b), bodyFilled, dealEmailHTML(d, bodyFilled, photoURL), atts);
      ok++; sentIds.push(b.id); pushLog('✅ ' + (i + 1) + '/' + recips.length + ' ' + b.email);
    } catch (e) { fail++; pushLog('❌ ' + (i + 1) + '/' + recips.length + ' ' + b.email + ' — ' + e.message); }
    if (blastRef) blastRef.set({ sent: ok, failed: fail, buyerIds: sentIds }, { merge: true }).catch(() => {});
    renderProg(i + 1, i < recips.length - 1 ? '' : 'Finishing…');

  blastRun = { cancel: false, finished: true };

}

// A deal qualifies for a buyer's one-off Text/Email picker if:
//  1. its stage is active (not dead/closed/assigned), AND
//  2a. the buyer was pulled for it via InvestorBase (dispoBuyerSearchResults buyerId+dealId), OR
//  2b. territory match: deal.city == buyer.buyingCity OR deal.county == buyer.buyingCounty (case-insensitive).
// Note: buyer docs carry no state field, so no state half to the match — city/county is the territory signal.
const INACTIVE_STAGES = ['dead', 'closed', 'assigned'];
function normStr(s) { return String(s || '').trim().toLowerCase(); }
async function relevantDealsForBuyer(b) {
  const active = deals.filter(d => !INACTIVE_STAGES.includes(normStr(d.stage)));
  if (!b) return active;
  const pulledDealIds = new Set();
  try {
    const snap = await db.collection('dispoBuyerSearchResults').where('buyerId', '==', b.id).get();
    snap.forEach(doc => { const did = (doc.data() || {}).dealId; if (did) pulledDealIds.add(did); });
  } catch (e) { console.warn('relevantDealsForBuyer pull lookup failed:', e.message); }
  const bCity = normStr(b.buyingCity), bCounty = normStr(b.buyingCounty);
  return active.filter(d => {
    if (pulledDealIds.has(d.id)) return true;
    const dCity = normStr(d.city), dCounty = normStr(d.county);
    return (bCity && dCity === bCity) || (bCounty && dCounty === bCounty);
  });
}
function dealOptionsHTML(list) {
  if (!list || !list.length) return '<option value="">No matching active deals for this buyer</option>';
  return list.map(dd => '<option value="' + dd.id + '">' + esc(dd.address) + '</option>').join('');
}
/* ---------------- Blast duplicate prevention ---------------- */
// Map of buyerId -> latest ISO timestamp they were contacted for this deal,
// from bulk blasts (buyerIds arrays) and one-off sends (buyerId field).
// Older blasts logged before buyerIds tracking only carry counts — those can't be excluded.
async function contactedBuyerIds(dealId, coll) {
  const map = new Map();
  try {
    const snap = await db.collection(coll).where('dealId', '==', dealId).get();
    snap.forEach(doc => {
      const x = doc.data() || {};
      const at = x.finishedAt || x.startedAt || '';
      const add = bid => { if (bid && (!map.has(bid) || String(at) > String(map.get(bid)))) map.set(bid, at); };
      if (Array.isArray(x.buyerIds)) x.buyerIds.forEach(add);
      else if (x.buyerId) add(x.buyerId);
    });
  } catch (e) { console.warn('contactedBuyerIds failed for ' + coll + ':', e.message); }
  return map;
}

}
